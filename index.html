<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architect Pro // High-Fidelity Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0a; --card: #141414; --border: #262626; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: #e5e5e5; overflow-x: hidden; }
        .serif { font-family: 'DM Serif Display', serif; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; }
        .input-dark { background: #000; border: 1px solid #333; color: white; border-radius: 8px; }
        .pulse-warn { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="pb-20">

    <header class="border-b border-neutral-800 bg-[#0a0a0a]/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-wrap items-center justify-between gap-6">
            <div>
                <h1 class="serif text-3xl">Architect Pro</h1>
                <p id="current-month-label" class="text-[10px] text-neutral-500 uppercase tracking-[0.2em] mt-1"></p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="toggleConfigModal()" class="bg-neutral-800 hover:bg-neutral-700 px-6 py-3 rounded-xl text-xs font-bold transition flex items-center gap-2 border border-neutral-700">
                    <i data-lucide="user-cog" class="w-4 h-4"></i> CONFIG INCOME
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 mt-10 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-8 space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="card p-6 border-l-4 border-emerald-500 shadow-lg">
                    <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-2">Daily Spend Limit</p>
                    <p id="dsl-val" class="serif text-4xl text-emerald-400">$0.00</p>
                </div>
                <div class="card p-6">
                    <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-2">Active Surplus (10%)</p>
                    <p id="surplus-val" class="serif text-4xl text-white">$0</p>
                </div>
                <div class="card p-6">
                    <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-wider mb-2">Health Score</p>
                    <p id="health-score" class="serif text-4xl text-amber-500">0</p>
                    <div class="w-full bg-neutral-800 h-1 mt-2 rounded-full overflow-hidden">
                        <div id="health-bar" class="h-full bg-emerald-500 transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <section class="card p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="serif text-xl flex items-center gap-2"><i data-lucide="calendar"></i> Payment Schedule</h2>
                    <button onclick="openAddEntry()" class="bg-emerald-600/10 hover:bg-emerald-600 text-emerald-500 hover:text-white px-3 py-1.5 rounded-lg text-[10px] font-bold transition-all flex items-center gap-2">
                        <i data-lucide="plus" class="w-3 h-3"></i> ADD OBLIGATION
                    </button>
                </div>
                <div id="ledger-list" class="space-y-3"></div>
                
                <div id="completed-header" class="mt-8 mb-4 hidden">
                    <p class="text-[10px] font-bold text-neutral-600 uppercase tracking-widest flex items-center gap-2">
                        <span class="h-[1px] flex-1 bg-neutral-800"></span>
                        Settled This Month
                        <span class="h-[1px] flex-1 bg-neutral-800"></span>
                    </p>
                </div>
                <div id="completed-list" class="space-y-3 opacity-40 grayscale"></div>
            </section>

            <section class="card p-6 border-dashed border-neutral-800 bg-transparent">
                <h3 class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-4">Calendar Integrations</h3>
                <div class="flex flex-wrap gap-4">
                    <button onclick="exportICS()" class="flex-1 min-w-[140px] bg-neutral-900 border border-neutral-800 p-4 rounded-xl hover:bg-neutral-800 transition text-left group">
                        <i data-lucide="download" class="w-5 h-5 text-emerald-500 mb-2"></i>
                        <p class="text-xs font-bold">Download .ICS</p>
                        <p class="text-[9px] text-neutral-500">For Apple & Outlook</p>
                    </button>
                    <a href="https://calendar.google.com" target="_blank" class="flex-1 min-w-[140px] bg-neutral-900 border border-neutral-800 p-4 rounded-xl hover:bg-neutral-800 transition text-left group">
                        <i data-lucide="calendar-plus" class="w-5 h-5 text-blue-500 mb-2"></i>
                        <p class="text-xs font-bold">Google Calendar</p>
                        <p class="text-[9px] text-neutral-500">Sync obligations</p>
                    </a>
                </div>
            </section>
        </div>

        <div class="lg:col-span-4 space-y-8">
            <div class="card p-8 sticky top-28">
                <h3 class="text-[10px] font-bold text-neutral-500 uppercase text-center mb-8">Allocation</h3>
                <div class="h-64 relative mb-8"><canvas id="donutChart"></canvas></div>
                <div id="legend" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <div id="config-modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-[100] items-center justify-center p-4" style="display: none;">
        <div class="card w-full max-w-lg p-10">
            <h2 class="serif text-3xl mb-6">Income Config</h2>
            <div class="space-y-4">
                <label class="text-[10px] font-bold text-neutral-500 uppercase">Monthly Take-Home Pay</label>
                <input type="number" id="e-income" class="w-full p-4 input-dark" placeholder="Income Amount">
                <button onclick="saveIncomeOnly()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold uppercase text-[10px]">Save Profile</button>
                <button onclick="toggleConfigModal()" class="w-full py-4 text-neutral-500 text-[10px]">Cancel</button>
            </div>
        </div>
    </div>

    <div id="entry-modal" class="hidden fixed inset-0 bg-black/95 backdrop-blur-md z-[100] items-center justify-center p-4" style="display: none;">
        <div class="card w-full max-w-lg p-10">
            <h2 class="serif text-3xl mb-6">New Obligation</h2>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <select id="e-type" class="p-4 input-dark text-sm" onchange="toggleDebtInputs()"><option value="fixed">Fixed Bill</option><option value="debt">Debt</option></select>
                    <input type="number" id="e-date" placeholder="Due Date (1-31)" class="p-4 input-dark text-sm">
                </div>
                <input type="text" id="e-name" placeholder="Label" class="w-full p-4 input-dark">
                <input type="number" id="e-amount" placeholder="Monthly Amount" class="w-full p-4 input-dark">
                <div id="debt-inputs" class="hidden grid grid-cols-2 gap-4">
                    <input type="number" id="e-balance" placeholder="Total Balance" class="p-4 input-dark"><input type="number" id="e-apr" placeholder="APR %" class="p-4 input-dark">
                </div>
                <button onclick="saveEntry()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold uppercase text-[10px]">Add to Ledger</button>
                <button onclick="toggleEntryModal()" class="w-full py-4 text-neutral-500 text-[10px]">Close</button>
            </div>
        </div>
    </div>

    <div id="payment-modal" class="fixed inset-0 items-center justify-center p-4" style="z-index: 9999; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); display: none;">
        <div class="card w-full max-w-sm p-8 bg-[#141414]">
            <h2 class="serif text-2xl mb-2">Confirm Payment</h2>
            <p id="pay-target-name" class="text-[10px] text-emerald-500 uppercase font-bold mb-6"></p>
            <div class="space-y-4">
                <input type="number" id="pay-extra-amount" class="w-full p-4 input-dark" placeholder="Extra Payment $">
                <button onclick="confirmTransaction()" class="w-full bg-emerald-600 py-4 rounded-xl font-bold text-[10px]">EXECUTE</button>
                <button onclick="closePaymentModal()" class="w-full py-4 text-neutral-500 text-[10px]">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        let state = { 
            income: 0, 
            items: [], 
            strategy: 'avalanche',
            lastResetMonth: new Date().getMonth() 
        };
        let activePaymentId = null;
        let donutChart = null;

        window.onload = () => {
            const saved = localStorage.getItem('arch_pro_v5');
            if (saved) state = JSON.parse(saved);
            
            const currentMonth = new Date().getMonth();
            if (state.lastResetMonth !== currentMonth) {
                state.items.forEach(i => i.paid = false);
                state.lastResetMonth = currentMonth;
            }

            document.getElementById('current-month-label').innerText = new Date().toLocaleString('default', { month: 'long', year: 'numeric' });
            render();
            lucide.createIcons();
        };

        function render() {
            const now = new Date();
            const currentDay = now.getDate();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const daysRemaining = daysInMonth - currentDay + 1;

            const unpaid = state.items.filter(i => !i.paid);
            const paid = state.items.filter(i => i.paid);
            
            const fixed = unpaid.reduce((acc, i) => acc + i.amount, 0);
            const buffer = state.income * 0.3;
            const liquidRemainder = Math.max(0, state.income - fixed - buffer);
            const surplus = liquidRemainder * 0.1;
            const savings = liquidRemainder * 0.9;
            const dsl = Math.max(0, (state.income - fixed) / daysRemaining);

            document.getElementById('dsl-val').innerText = `$${dsl.toFixed(2)}`;
            document.getElementById('surplus-val').innerText = `$${surplus.toFixed(0)}`;
            
            updateHealthScore(fixed, buffer, surplus + savings);
            renderLedgers(currentDay, unpaid, paid);
            updateCharts(fixed, buffer, surplus, savings);
            localStorage.setItem('arch_pro_v5', JSON.stringify(state));
        }

        function updateHealthScore(fixed, buffer, savings) {
            if (state.income === 0) return;
            const fixedPct = (fixed / state.income) * 100;
            const savingsPct = (savings / state.income) * 100;
            let score = 100;
            if (fixedPct > 50) score -= (fixedPct - 50) * 1.5;
            if (savingsPct < 20) score -= (20 - savingsPct) * 2;
            const finalScore = Math.max(0, Math.min(100, Math.round(score)));
            document.getElementById('health-score').innerText = finalScore;
            document.getElementById('health-bar').style.width = `${finalScore}%`;
        }

        function renderLedgers(today, unpaid, paid) {
            const unpaidList = document.getElementById('ledger-list');
            const paidList = document.getElementById('completed-list');
            const compHeader = document.getElementById('completed-header');

            unpaid.sort((a,b) => a.date - b.date);
            paid.sort((a,b) => a.date - b.date);

            unpaidList.innerHTML = unpaid.map(i => {
                const isOverdue = today > i.date;
                const isUrgent = i.date - today <= 3 && i.date - today >= 0;
                return `
                <div class="flex justify-between items-center p-4 bg-neutral-900/30 rounded-xl border ${isOverdue ? 'border-rose-900/50' : isUrgent ? 'border-amber-900/50' : 'border-neutral-800'}">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <div class="text-emerald-500 font-bold text-xs bg-neutral-800 p-2 rounded">D${i.date}</div>
                            ${isUrgent || isOverdue ? `<div class="absolute -top-2 -right-2 bg-${isOverdue ? 'rose' : 'amber'}-500 rounded-full p-0.5 pulse-warn"><i data-lucide="alert-circle" class="w-3 h-3 text-white"></i></div>` : ''}
                        </div>
                        <div>
                            <p class="text-[9px] text-neutral-500 uppercase font-bold">${isOverdue ? '<span class="text-rose-500">OVERDUE</span>' : isUrgent ? '<span class="text-amber-500">DUE SOON</span>' : i.type}</p>
                            <h4 class="text-sm font-bold">${i.name}</h4>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="serif">$${i.amount}</p>
                        <button onclick="openPaymentModal('${i.id}')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-[9px] font-bold transition-colors">PAID</button>
                        <button onclick="removeEntry('${i.id}')" class="text-neutral-600 hover:text-rose-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>`;
            }).join('');

            if (paid.length > 0) {
                compHeader.classList.remove('hidden');
                paidList.innerHTML = paid.map(i => `
                <div class="flex justify-between items-center p-4 bg-neutral-900/10 rounded-xl border border-neutral-800">
                    <div class="flex items-center gap-4">
                        <div class="text-neutral-600 font-bold text-xs bg-neutral-900 p-2 rounded">D${i.date}</div>
                        <h4 class="text-sm font-bold text-neutral-500 line-through">${i.name}</h4>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="serif text-neutral-600">$${i.amount}</p>
                        <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500/50"></i>
                    </div>
                </div>`).join('');
            } else {
                compHeader.classList.add('hidden');
                paidList.innerHTML = '';
            }
            lucide.createIcons();
        }

        function updateCharts(fixed, buffer, surplus, savings) {
            const ctx = document.getElementById('donutChart').getContext('2d');
            if (donutChart) donutChart.destroy();
            donutChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [fixed, buffer, surplus, savings], backgroundColor: ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6'], borderWidth: 0 }] },
                options: { cutout: '85%', plugins: { legend: { display: false } } }
            });
            document.getElementById('legend').innerHTML = ['Remaining Bills', 'Buffer', 'Surplus', 'Savings'].map((l, i) => `
                <div class="flex justify-between text-xs"><span>${l}</span><span class="font-bold">$${[fixed, buffer, surplus, savings][i].toFixed(0)}</span></div>`).join('');
        }

        // ICS Export Logic
        function exportICS() {
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//ArchitectPro//NONSGML v1.0//EN\n";
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');

            state.items.forEach(item => {
                const day = String(item.date).padStart(2, '0');
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `SUMMARY:Pay ${item.name} ($${item.amount})\n`;
                icsContent += `DTSTART:${year}${month}${day}T090000\n`;
                icsContent += `DTEND:${year}${month}${day}T100000\n`;
                icsContent += `DESCRIPTION:Financial obligation due via Architect Pro dashboard.\n`;
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'obligations.ics');
            link.click();
        }

        // Modal Controls
        function toggleConfigModal() { 
            const m = document.getElementById('config-modal');
            m.style.display = m.style.display === 'none' ? 'flex' : 'none';
            if (state.income) document.getElementById('e-income').value = state.income;
        }
        function toggleEntryModal() {
            const m = document.getElementById('entry-modal');
            m.style.display = m.style.display === 'none' ? 'flex' : 'none';
        }
        function openAddEntry() { toggleEntryModal(); }
        function openPaymentModal(id) {
            activePaymentId = id;
            const item = state.items.find(i => i.id === id);
            document.getElementById('pay-target-name').innerText = `${item.name} Settlement`;
            document.getElementById('payment-modal').style.display = 'flex';
        }
        function closePaymentModal() { document.getElementById('payment-modal').style.display = 'none'; }
        
        function confirmTransaction() {
            const extra = parseFloat(document.getElementById('pay-extra-amount').value) || 0;
            const item = state.items.find(i => i.id === activePaymentId);
            if (item) {
                if (item.type === 'debt') {
                    item.balance = Math.max(0, item.balance - (item.amount + extra));
                }
                item.paid = true;
            }
            render(); closePaymentModal();
        }

        function saveIncomeOnly() {
            const inc = parseFloat(document.getElementById('e-income').value);
            if (inc) state.income = inc;
            render(); toggleConfigModal();
        }

        function saveEntry() {
            state.items.push({
                id: Date.now().toString(),
                type: document.getElementById('e-type').value,
                name: document.getElementById('e-name').value,
                amount: parseFloat(document.getElementById('e-amount').value) || 0,
                date: parseInt(document.getElementById('e-date').value) || 1,
                balance: parseFloat(document.getElementById('e-balance').value) || 0,
                paid: false
            });
            render(); toggleEntryModal();
        }

        function toggleDebtInputs() { document.getElementById('debt-inputs').classList.toggle('hidden', document.getElementById('e-type').value !== 'debt'); }
        function removeEntry(id) { state.items = state.items.filter(i => i.id !== id); render(); }
    </script>
</body>
</html>
