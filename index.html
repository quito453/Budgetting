    }
    const field = (id, label, type, val = '', extra = '') => `<div><label class="label" for="${id}">${esc(label)}</label><input id="${id}" type="${type}" class="input" value="${esc(val)}" ${extra}></div>`;
    const msgP = o => `<p id="a-msg" class="small ${o.ok ? 'accent' : 'danger'}" style="min-height:20px">${esc(o.msg || '')}</p>`;
    function keypadAuth() {
        const k = n => `<button onclick="authKey('${n}')">${n}</button>`;
        return `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}<span></span>${k(0)}<button class="ghost" onclick="authKey('del')" aria-label="⌫">⌫</button></div>`;
    }
    const dotsAuth = n => `<div id="a-dots" class="pin-dots">${Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;

    function showAuth(view, opts = {}) {
        AUTH.view = view; AUTH.opts = opts;
        const el = $('auth'), dev = getDevice();
        let html = '';
        if (view === 'loading') html = `<p class="muted" style="text-align:center">${esc(t('aLoading'))}</p>`;
        else if (view === 'delete') html = deleteViewHTML();
        else if (view === 'config') html = `<h2 class="auth-h">${esc(t('aConfigTitle'))}</h2><p class="small muted">${esc(t('aConfigBody'))}</p>`;
        else if (view === 'login') html = `<h2 class="auth-h">${esc(t('aLoginTitle'))}</h2>
            <form class="stack" style="gap:12px" onsubmit="event.preventDefault(); doLogin()">
                ${field('a-email', t('aEmail'), 'email', opts.email || (dev && dev.email) || '', 'autocomplete="email" inputmode="email" required')}
                ${field('a-pass', t('aPassword'), 'password', '', 'autocomplete="current-password" required')}
                ${msgP(opts)}
                <button class="btn btn-primary btn-block" type="submit">${esc(t('aLoginBtn'))}</button>
            </form>
            <div class="auth-links"><button class="btn-link small" onclick="showAuth('forgot', {email: $('a-email').value})">${esc(t('aForgot'))}</button>
            <p class="small muted">${esc(t('aNoAccount'))} <button class="btn-link small" onclick="showAuth('signup', {email: $('a-email').value})">${esc(t('aCreate'))}</button></p>
            ${legalLinkHTML('btn-link tiny muted')}</div>`;
        else if (view === 'signup') html = `<h2 class="auth-h">${esc(t('aSignupTitle'))}</h2>
            <form class="stack" style="gap:12px" onsubmit="event.preventDefault(); doSignup()">
                ${field('a-email', t('aEmail'), 'email', opts.email || '', 'autocomplete="email" inputmode="email" required')}
                ${field('a-pass', t('aPassword'), 'password', '', 'autocomplete="new-password" minlength="8" required')}
                ${field('a-pass2', t('aPassword2'), 'password', '', 'autocomplete="new-password" minlength="8" required')}
                <p class="tiny muted">${esc(t('aPwHint'))}</p>
                <label class="row small" style="gap:10px; align-items:flex-start; cursor:pointer"><input type="checkbox" id="a-agree" style="width:18px; height:18px; margin-top:2px; accent-color: var(--accent)">
                    <span>${esc(t('signupAgree', { link: '\u0000' })).replace('\u0000', `<a class="btn-link small" href="${legalUrl()}" target="_blank" rel="noopener">${esc(t('signupAgreeLink'))}</a>`)}</span></label>
                ${msgP(opts)}
                <button class="btn btn-primary btn-block" type="submit">${esc(t('aSignupBtn'))}</button>
            </form>
            <div class="auth-links"><p class="small muted">${esc(t('aHaveAccount'))} <button class="btn-link small" onclick="showAuth('login')">${esc(t('aLoginLink'))}</button></p></div>`;
        else if (view === 'check') html = `<h2 class="auth-h">📬 ${esc(t('aCheckTitle'))}</h2><p class="muted">${esc(t('aCheckBody', { email: opts.email || '' }))}</p>
            <button class="btn btn-ghost btn-block mt-4" onclick="showAuth('login', {email: '${esc(opts.email || '')}'})">${esc(t('aBack'))}</button>`;
        else if (view === 'forgot') html = `<h2 class="auth-h">${esc(t('aForgotTitle'))}</h2><p class="small muted mb-3">${esc(t('aForgotBody'))}</p>
            <form class="stack" style="gap:12px" onsubmit="event.preventDefault(); doForgot()">
                ${field('a-email', t('aEmail'), 'email', opts.email || '', 'autocomplete="email" inputmode="email" required')}
                ${msgP(opts)}<button class="btn btn-primary btn-block" type="submit">${esc(t('aForgotBtn'))}</button>
            </form><div class="auth-links"><button class="btn-link small" onclick="showAuth('login')">${esc(t('aBack'))}</button></div>`;
        else if (view === 'newpass') html = `<h2 class="auth-h">${esc(t('aNewPassTitle'))}</h2>
            <form class="stack" style="gap:12px" onsubmit="event.preventDefault(); doNewPass()">
                ${field('a-pass', t('aPassword'), 'password', '', 'autocomplete="new-password" minlength="8" required')}
                ${field('a-pass2', t('aPassword2'), 'password', '', 'autocomplete="new-password" minlength="8" required')}
                ${msgP(opts)}<button class="btn btn-primary btn-block" type="submit">${esc(t('aNewPassBtn'))}</button>
            </form>`;
        else if (view === 'pinset') {
            AUTH.pinBuf = ''; AUTH.pinStage = 'new'; AUTH.pinFirst = '';
            html = `<div class="auth-pin"><h2 class="auth-h" id="a-pin-title">${esc(t(opts.reset || opts.change ? 'aPinResetTitle' : 'aPinCreateTitle'))}</h2><p class="small muted" id="a-pin-body">${esc(t(opts.reset || opts.change ? 'aPinResetBody' : 'aPinCreateBody'))}</p>
                ${dotsAuth(0)}${keypadAuth()}${msgP(opts)}</div>`;
        } else if (view === 'pinverify') {
            AUTH.pinBuf = '';
            html = `<div class="auth-pin"><h2 class="auth-h">${esc(t('aPinVerifyTitle'))}</h2><p class="small muted">${esc(opts.migrate ? t('aPinUnify') : t('aPinVerifyBody'))}</p>
                ${dotsAuth(0)}${keypadAuth()}${msgP(opts)}
                <div class="auth-links"><button class="btn-link small" onclick="forgotAccountPin()">${esc(t('aPinForgot'))}</button></div></div>`;
        } else if (view === 'pin') {
            AUTH.pinBuf = '';
            html = `<div class="auth-pin"><h2 class="auth-h">${esc(t('aPinTitle'))}</h2><p class="small muted">${esc(t('aPinBody'))}</p>
                <input id="a-email" type="email" class="input" style="text-align:center" value="${esc((dev && dev.email) || '')}" autocomplete="email" inputmode="email" aria-label="${esc(t('aEmail'))}" ${opts.relock ? 'readonly' : ''}>
                ${dotsAuth(0)}${keypadAuth()}${msgP(opts)}
                <div class="auth-links"><button class="btn-link small" onclick="showAuth('login', {email: (getDevice()||{}).email})">${esc(t('aUsePassword'))}</button>
                ${opts.relock ? '' : `<button class="btn-link small muted" onclick="switchAccount()">${esc(t('aOtherAccount'))}</button>`}</div></div>`;
        }
        el.innerHTML = authShell(html);
        el.classList.add('open');
        document.body.style.overflow = 'hidden';
        const first = el.querySelector('input:not([readonly])');
        if (first && view !== 'pin') setTimeout(() => first.focus(), 50);
    }
    function hideAuth() { $('auth').classList.remove('open'); $('auth').innerHTML = ''; document.body.style.overflow = ''; AUTH.view = null; }
    function setAuthMsg(msg, ok) { const m = $('a-msg'); if (m) { m.textContent = msg; m.className = 'small ' + (ok ? 'accent' : 'danger'); } }
    function busy(on) { $('auth').querySelectorAll('button[type=submit]').forEach(b => { b.disabled = on; b.style.opacity = on ? .6 : 1; }); }
    function authLang(l) { state.lang = l; lsSet('ap.lang', l); applyStaticTranslations(); showAuth(AUTH.view, AUTH.opts); }

    // ---------- actions ----------
    async function doLogin() {
        const email = $('a-email').value.trim(), password = $('a-pass').value;
        if (!validEmail(email)) return setAuthMsg(t('eEmail'));
        busy(true);
        try {
            const { data, error } = await makeClient().auth.signInWithPassword({ email, password });
            if (error) return setAuthMsg(authErr(error));
            await afterPasswordAuth(data.user);
        } catch (e) { setAuthMsg(authErr(e)); } finally { busy(false); }
    }
    async function doSignup() {
        const email = $('a-email').value.trim(), p1 = $('a-pass').value, p2 = $('a-pass2').value;
        if (!validEmail(email)) return setAuthMsg(t('eEmail'));
        if (p1.length < 8) return setAuthMsg(t('eWeak'));
        if (p1 !== p2) return setAuthMsg(t('eMatch'));
        if (!$('a-agree').checked) return setAuthMsg(t('eAgree'));
        busy(true);
        try {
            const { data, error } = await makeClient().auth.signUp({ email, password: p1, options: { emailRedirectTo: appUrl(), data: { accepted_terms: '2026-10-20' } } });
            if (error) return setAuthMsg(authErr(error));
            if (data.session) await afterPasswordAuth(data.user);
            else showAuth('check', { email });
        } catch (e) { setAuthMsg(authErr(e)); } finally { busy(false); }
    }
    async function doForgot() {
        const email = $('a-email').value.trim();
        if (!validEmail(email)) return setAuthMsg(t('eEmail'));
        busy(true);
        try {
            const { error } = await makeClient().auth.resetPasswordForEmail(email, { redirectTo: appUrl() });
            if (error && /rate|too many/i.test(String(error.message || '') + (error.status || ''))) return setAuthMsg(t('eRate'));
            setAuthMsg(t('aForgotSent'), true);
        } catch (e) { setAuthMsg(authErr(e)); } finally { busy(false); }
    }
    async function doNewPass() {
        const p1 = $('a-pass').value, p2 = $('a-pass2').value;
        if (p1.length < 8) return setAuthMsg(t('eWeak'));
        if (p1 !== p2) return setAuthMsg(t('eMatch'));
        busy(true);
        try {
            const { data, error } = await makeClient().auth.updateUser({ password: p1 });
            if (error) return setAuthMsg(authErr(error));
            AUTH.recovery = false;
            await afterPasswordAuth(data.user);
        } catch (e) { setAuthMsg(authErr(e)); } finally { busy(false); }
    }
    function switchAccount() { wipeDevice(); showAuth('login'); }

    function drawAuthDots(n) { const d = $('a-dots'); if (d) d.innerHTML = Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); }
    function shakeAuth() { const d = $('a-dots'); if (d) { d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); } }
    async function authKey(k) {
        if (AUTH.view !== 'pin' && AUTH.view !== 'pinset' && AUTH.view !== 'pinverify') return;
        if (AUTH.checking) return;
        if (k === 'del') AUTH.pinBuf = AUTH.pinBuf.slice(0, -1); else if (AUTH.pinBuf.length < PIN_LEN) AUTH.pinBuf += k;
        drawAuthDots(AUTH.pinBuf.length);
        if (AUTH.pinBuf.length < PIN_LEN) return;
        const entered = AUTH.pinBuf;
        AUTH.checking = true;
        try { if (AUTH.view === 'pinset') await pinSetStep(entered); else if (AUTH.view === 'pinverify') await pinVerifyStep(entered); else await pinUnlock(entered); }
        finally { AUTH.checking = false; }
    }
    async function pinSetStep(entered) {
        if (AUTH.pinStage === 'new') {
            AUTH.pinFirst = entered; AUTH.pinBuf = ''; AUTH.pinStage = 'confirm';
            $('a-pin-title').textContent = t('aPinConfirmTitle'); setAuthMsg('');
            setTimeout(() => drawAuthDots(0), 150);
            return;
        }
        if (entered !== AUTH.pinFirst) {
            AUTH.pinBuf = ''; AUTH.pinFirst = ''; AUTH.pinStage = 'new';
            $('a-pin-title').textContent = t('aPinCreateTitle'); setAuthMsg(t('aPinMismatch')); shakeAuth();
            setTimeout(() => drawAuthDots(0), 400);
            return;
        }
        if (!hasCrypto()) { setAuthMsg(t('aNoCrypto')); return; }
        const user = AUTH.user || ((await makeClient().auth.getUser()).data || {}).user;
        const changing = AUTH.opts.change;
        const saved = await saveAccountPin(entered);
        await setupDeviceVault(entered, AUTH.user || user);
        if (!saved) toast(t('aPinSaveFail'));
        if (changing) { hideAuth(); if (saved) toast(t('aPinChanged')); return; }
        clearOtherUsers(user.id); // a different account on this device: drop other people's cached data
        startApp(AUTH.user || user);
    }
    async function pinVerifyStep(entered) {
        const ap = accountPin(AUTH.user);
        if (!ap) { showAuth('pinset'); return; }
        const ok = (await pinVerifier(entered, ap.salt)) === ap.hash;
        AUTH.pinBuf = '';
        if (!ok) {
            AUTH.verifyTries = (AUTH.verifyTries || 0) + 1;
            if (AUTH.verifyTries >= MAX_TRIES) {
                try { await makeClient().auth.signOut({ scope: 'local' }); } catch (e) { /* offline */ }
                wipeDevice(); showAuth('login', { email: AUTH.user.email, msg: t('aPinLocked') }); return;
            }
            setAuthMsg(t('aPinWrongN', { n: MAX_TRIES - AUTH.verifyTries })); shakeAuth();
            setTimeout(() => drawAuthDots(0), 400);
            return;
        }
        await setupDeviceVault(entered, AUTH.user);
        clearOtherUsers(AUTH.user.id);
        startApp(AUTH.user);
    }
    // Only offered right after a correct password (or a correct old PIN), so replacing the PIN is safe.
    function forgotAccountPin() { showAuth('pinset', { reset: true }); }

    async function pinUnlock(entered) {
        const dev = getDevice();
        const email = ($('a-email').value || '').trim().toLowerCase();
        if (!dev) { showAuth('login'); return; }
        if (email !== String(dev.email).toLowerCase()) {
            AUTH.pinBuf = ''; drawAuthDots(0);
            setAuthMsg(t('aPinOtherEmail'));
            setTimeout(() => showAuth('login', { email: $('a-email') ? $('a-email').value.trim() : '' }), 1600);
            return;
        }
        const ok = await openVault(entered);
        if (!ok) {
            dev.tries = (dev.tries || 0) + 1;
            AUTH.pinBuf = '';
            if (dev.tries >= MAX_TRIES) { wipeDevice(); showAuth('login', { email: dev.email, msg: t('aPinLocked') }); return; }
            setDevice(dev); setAuthMsg(t('aPinWrong', { n: MAX_TRIES - dev.tries })); shakeAuth();
            setTimeout(() => drawAuthDots(0), 400);
            return;
        }
        dev.tries = 0; setDevice(dev);
        if (AUTH.opts.relock && AUTH.started) { hideAuth(); return; }
        const sb = makeClient();
        let session = null;
        try { session = (await sb.auth.getSession()).data.session; } catch (e) { session = null; }
        if (session && session.user) {
            const user = await freshUser(session.user);
            const ap = accountPin(user);
            if (!ap) { AUTH.user = user; if (navigator.onLine) saveAccountPin(entered); startApp(AUTH.user); return; }
            if ((await pinVerifier(entered, ap.salt)) === ap.hash) { startApp(user); return; }
            // This device still has an older, different PIN: switch it to the account PIN.
            AUTH.user = user; AUTH.verifyTries = 0;
            showAuth('pinverify', { migrate: true });
            return;
        }
        if (!navigator.onLine && AUTH.mem.size) { AUTH.offline = true; startApp({ id: dev.uid, email: dev.email }); return; }
        wipeDevice();
        showAuth('login', { email: dev.email, msg: t('aExpired') });
    }

    // ---------- app start + data sync ----------
    function startApp(user) {
        AUTH.user = user; AUTH.started = true;
        STORAGE_KEY = 'arch_pro_v9:' + user.id;
        // Data from the older single-user version on this same address: adopt it once, then remove the unprotected copy.
        const legacy = lsGet('arch_pro_v9');
        if (legacy && !lsGet(STORAGE_KEY)) { lsSet(STORAGE_KEY, legacy); AUTH.legacyImported = true; }
        if (legacy) lsDel('arch_pro_v9');
        const lang = state.lang;
        state = defaults(); state.lang = lang;
        sync.lastBody = null;
        loadState();
        hideAuth();
        resetCharts(); render();
        if (AUTH.offline) toast(t('aOffline'));
        initWebSync();
    }

    async function pullRemote(force) {
        if (!AUTH.sb || !AUTH.user || AUTH.offline && !navigator.onLine) return;
        if (!force && Date.now() - AUTH.lastPull < 20000) return;
        AUTH.lastPull = Date.now();
        try {
            const { data, error } = await AUTH.sb.from('app_state').select('data, updated_at').eq('user_id', AUTH.user.id).maybeSingle();
            if (error) throw error;
            AUTH.offline = false; sync.on = true;
            if (data && +data.updated_at > (state.updatedAt || 0)) {
                if (applyRemote(JSON.stringify(data.data))) render();
            } else if (!data || (state.updatedAt || 0) > +data.updated_at) {
                if (state.items.length || state.income || state.expenses.length || state.goals.length) pushRemote();
            }
        } catch (e) { sync.on = false; }
        renderSyncStatus();
    }

    function initWebSync() {
        const sb = AUTH.sb, uid = AUTH.user.id;
        if (!sb) return;
        sync.writer = async payload => {
            try {
                const { error } = await sb.from('app_state').upsert({ user_id: uid, data: JSON.parse(payload.json), updated_at: payload.updatedAt });
                if (error) throw error;
                sync.on = true;
            } catch (e) { sync.on = false; }
            renderSyncStatus();
        };
        pullRemote(true);
        try {
            if (AUTH.channel) sb.removeChannel(AUTH.channel);
            AUTH.channel = sb.channel('app_state_' + uid)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'user_id=eq.' + uid }, p => {
                    const r = p.new;
                    if (r && r.data && +r.updated_at > (state.updatedAt || 0) && applyRemote(JSON.stringify(r.data))) { render(); toast(t('syncUpdated')); }
                }).subscribe();
        } catch (e) { /* realtime is optional; focus refresh still works */ }
    }
    window.addEventListener('online', () => { if (AUTH.started) pullRemote(true); });
    window.addEventListener('focus', () => { if (AUTH.started) pullRemote(false); });
    document.addEventListener('visibilitychange', () => {
        if (!window.APP_CONFIG || !AUTH.started) return;
        if (document.hidden) { AUTH.hiddenAt = Date.now(); return; }
        if (AUTH.hiddenAt && Date.now() - AUTH.hiddenAt > 2 * 60 * 1000 && getDevice()) showAuth('pin', { relock: true });
        else pullRemote(false);
    });
    document.addEventListener('keydown', e => {
        if (!AUTH.view || !['pin', 'pinset', 'pinverify'].includes(AUTH.view)) return;
        if (document.activeElement && document.activeElement.id === 'a-email') return;
        if (/^[0-9]$/.test(e.key)) authKey(e.key); else if (e.key === 'Backspace') authKey('del');
    });

    // ---------- profile: account section ----------
    function webAccountHTML() {
        const email = AUTH.user ? AUTH.user.email : '';
        return `<div class="note plain small full">👤 ${esc(t('aSignedAs', { email }))}</div>
            <button class="btn btn-ghost" onclick="webChangePin()"><i data-lucide="lock"></i>${esc(t('aChangePin'))}</button>
            <button class="btn btn-ghost" onclick="webLockNow()">${esc(t('aLockNow'))}</button>
            <button class="btn btn-ghost danger full" onclick="webLogout()">${esc(t('aLogout'))}</button>
            ${remindersHTML()}
            <div class="full row wrap mt-2" style="gap:14px; justify-content:space-between">${legalLinkHTML()}<button class="btn-link small danger" onclick="webDeleteAccount()">${esc(t('delBtn'))}</button></div>`;
    }
    function webChangePin() { closeModal('config-modal'); showAuth('pinset', { change: true }); }
    function webLockNow() { closeModal('config-modal'); showAuth('pin', { relock: true }); }
    async function webLogout() {
        if (!(await askConfirm(t('aLogoutConfirm'), t('aLogout'), true))) return;
        try { if (AUTH.channel) AUTH.sb.removeChannel(AUTH.channel); await AUTH.sb.auth.signOut({ scope: 'local' }); } catch (e) { /* offline */ }
        wipeDevice();
        lsDel(STORAGE_KEY);
        location.replace(appUrl());
    }

    // ---------- boot ----------
    async function webBoot() {
        const savedLang = lsGet('ap.lang');
        if (savedLang && LOCALES[savedLang]) state.lang = savedLang;
        applyTheme(); applyStaticTranslations();
        const C = window.APP_CONFIG || {};
        if (!window.supabase || !C.supabaseUrl || !C.supabaseAnonKey || /TU-PROYECTO|PEGA_AQUI/.test(C.supabaseUrl + C.supabaseAnonKey)) { showAuth('config'); return; }
        const hash = location.hash || '';
        if (/access_token=|type=recovery|error_description=/.test(hash)) {
            AUTH.recovery = /type=recovery/.test(hash);
            const errMsg = (hash.match(/error_description=([^&]+)/) || [])[1];
            showAuth('loading');
            const sb = makeClient();
            let session = null;
            try { session = (await sb.auth.getSession()).data.session; } catch (e) { /* handled below */ }
            history.replaceState(null, '', appUrl());
            if (AUTH.recovery && session) { AUTH.user = session.user; showAuth('newpass'); return; }
            if (session) { await afterPasswordAuth(session.user); return; }
            showAuth('login', { msg: errMsg ? decodeURIComponent(errMsg.replace(/\+/g, ' ')) : t('aExpired') });
            return;
        }
        const dev = getDevice();
        if (dev && lsGet(VAULT_KEY)) showAuth('pin'); else showAuth('login');
    }

    // ================= Web version: reminders (Web Push), delete account, legal links =================
    Object.assign(I18N.es, {
        nTitle: 'Recordatorios de tarjetas', nDesc: 'Te avisamos antes de la fecha límite de tus tarjetas, aunque Valiu esté cerrada.',

        nEnabled: 'Recordatorios activados 🔔', nDisabled: 'Recordatorios desactivados.', nFail: 'No pudimos activar los recordatorios: {msg}',

        delExport: 'Antes de borrar, puedes guardar una copia:', delExportBtn: 'Exportar respaldo', delPass: 'Escribe tu contraseña para confirmar',

    });
    Object.assign(I18N.en, {
        nTitle: 'Card reminders', nDesc: 'We remind you before your cards are due, even when Valiu is closed.',
        nOn: 'Turn on reminders', nOff: 'Turn off', nActive: 'Reminders on for this device ✓', nInactive: 'Reminders off for this device.',
        nWhen: 'Remind me', nD3: '3 days before', nD1: '1 day before', nD0: 'On the due date', nDm1: 'If I miss it',
        nTest: 'Test notification', nTestTitle: 'Valiu', nTestBody: 'This is how your payment reminders will look. 🔔',
        nDenied: 'Notifications are blocked. Allow them for this site in your browser settings.',
        nUnsupported: "This browser doesn't support notifications.", nIos: 'On iPhone: first add Valiu to your Home Screen (Share → Add to Home Screen) and open it from there.',
        nEnabled: 'Reminders turned on 🔔', nDisabled: 'Reminders turned off.', nFail: "Couldn't turn on reminders: {msg}",
        nNote: 'We notify you at 8:00 a.m. (Guatemala time) about cards you added with their statement.',
        delTitle: 'Delete my account', delBtn: 'Delete my account', delBody: 'This permanently deletes your account, your financial data and your reminders. It cannot be undone.',
        delExport: 'Before deleting, you can save a copy:', delExportBtn: 'Export backup', delPass: 'Enter your password to confirm',
        delConfirm: 'Delete forever', delDone: 'Your account and data were deleted.', delFail: "Couldn't delete the account: {msg}",
        legalLink: 'Privacy notice and terms', signupAgree: 'I accept the {link}.', signupAgreeLink: 'privacy notice and terms of use',
        eAgree: 'To create your account, accept the privacy notice and terms.'
    });

    // ---------- push reminders ----------
    const NOTIFY_DAYS = [3, 1, 0, -1];
    function notifyPrefs() {
        const n = state.notify || {};
        return { on: !!n.on, days: Array.isArray(n.days) && n.days.length ? n.days.filter(d => NOTIFY_DAYS.includes(d)) : [3, 1, 0] };
    }
    const vapidKey = () => (window.APP_CONFIG || {}).vapidPublicKey;
    const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!vapidKey(); }
    function b64urlToBytes(s) {
        const pad = '='.repeat((4 - s.length % 4) % 4), b = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from(b, c => c.charCodeAt(0));
    }
    async function swReady() {
        if (!navigator.serviceWorker.controller && (location.protocol === 'https:' || location.hostname === 'localhost')) { try { await navigator.serviceWorker.register('sw.js'); } catch (e) { /* already registered */ } }
        return Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('service worker')), 8000))]);
    }
    async function enableReminders() {
        if (!pushSupported()) { toast(isIOS() && !isStandalone() ? t('nIos') : t('nUnsupported')); return; }
        if (isIOS() && !isStandalone()) { toast(t('nIos')); return; }
        try {
            const perm = await Notification.requestPermission();
            if (perm !== 'granted') { toast(t('nDenied')); return; }
            const reg = await swReady();
            let sub = await reg.pushManager.getSubscription();
            if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlToBytes(vapidKey()) });
            const j = sub.toJSON();
            const { error } = await AUTH.sb.from('push_subscriptions').upsert({
                endpoint: j.endpoint, user_id: AUTH.user.id, p256dh: j.keys.p256dh, auth: j.keys.auth, lang: state.lang, ua: navigator.userAgent.slice(0, 180)
            });
            if (error) throw error;
            state.notify = { ...notifyPrefs(), on: true };
            render(); renderProfileExtras(); toast(t('nEnabled'));
        } catch (e) { toast(t('nFail', { msg: e && e.message ? e.message : String(e) })); }
    }
    async function disableReminders() {
        try {
            const reg = await navigator.serviceWorker.getRegistration();
            const sub = reg && await reg.pushManager.getSubscription();
            if (sub) { await AUTH.sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
        } catch (e) { /* still turn it off locally */ }
        state.notify = { ...notifyPrefs(), on: false };
        render(); renderProfileExtras(); toast(t('nDisabled'));
    }
    function toggleNotifyDay(d) {
        const p = notifyPrefs();
        p.days = p.days.includes(d) ? p.days.filter(x => x !== d) : [...p.days, d].sort((a, b) => b - a);
        state.notify = p; render(); renderProfileExtras();
    }
    async function testReminder() {
        try {
            const reg = await swReady();
            await reg.showNotification(t('nTestTitle'), { body: t('nTestBody'), icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'valiu-test' });
        } catch (e) { toast(t('nFail', { msg: e.message || e })); }
    }
    function remindersHTML() {
        const p = notifyPrefs();
        const granted = 'Notification' in window && Notification.permission === 'granted';
        const on = p.on && granted;
        const chip = (d, k) => `<button class="toggle-chip ${p.days.includes(d) ? 'on' : ''}" onclick="toggleNotifyDay(${d})">${p.days.includes(d) ? '✓ ' : ''}${esc(t(k))}</button>`;
        return `<p class="label full mt-2">🔔 ${esc(t('nTitle'))}</p>
            <p class="tiny muted full">${esc(t('nDesc'))}</p>
            <div class="note ${on ? 'ok' : 'plain'} small full">${esc(on ? t('nActive') : t('nInactive'))}</div>
            ${on ? `<button class="btn btn-ghost" onclick="testReminder()">${esc(t('nTest'))}</button><button class="btn btn-ghost" onclick="disableReminders()">${esc(t('nOff'))}</button>`
                 : `<button class="btn btn-primary full" onclick="enableReminders()">${esc(t('nOn'))}</button>`}
            <div class="full"><p class="tiny muted mb-2">${esc(t('nWhen'))}</p><div class="row wrap" style="gap:6px">${chip(3, 'nD3')}${chip(1, 'nD1')}${chip(0, 'nD0')}${chip(-1, 'nDm1')}</div></div>
            <p class="tiny faint full">${esc(t('nNote'))}</p>`;
    }

    // ---------- delete account ----------
    function webDeleteAccount() { closeModal('config-modal'); showAuth('delete'); }
    async function doDeleteAccount() {
        const pass = $('a-pass').value;
        if (!pass) return setAuthMsg(t('delPass'));
        busy(true);
        try {
            const sb = makeClient();
            const { error: e1 } = await sb.auth.signInWithPassword({ email: AUTH.user.email, password: pass });
            if (e1) return setAuthMsg(authErr(e1));
            try {
                const reg = await navigator.serviceWorker.getRegistration();
                const sub = reg && await reg.pushManager.getSubscription();
                if (sub) await sub.unsubscribe();
            } catch (e) { /* no push */ }
            const { error: e2 } = await sb.rpc('delete_my_account');
            if (e2) return setAuthMsg(t('delFail', { msg: e2.message || e2 }));
            try { if (AUTH.channel) sb.removeChannel(AUTH.channel); await sb.auth.signOut({ scope: 'local' }); } catch (e) { /* already gone */ }
            wipeDevice(); lsDel(STORAGE_KEY);
            AUTH.started = false; state = defaults(); sync.on = false; sync.writer = null;
            showAuth('login', { msg: t('delDone'), ok: true });
        } catch (e) { setAuthMsg(t('delFail', { msg: e.message || e })); } finally { busy(false); }
    }
    function deleteViewHTML() {
        return `<h2 class="auth-h danger">${esc(t('delTitle'))}</h2>
            <p class="small muted">${esc(t('delBody'))}</p>
            <div class="note plain small">${esc(t('delExport'))} <button class="btn-link small" onclick="exportBackup()">${esc(t('delExportBtn'))}</button></div>
            <form class="stack" style="gap:12px" onsubmit="event.preventDefault(); doDeleteAccount()">
                <div><label class="label" for="a-pass">${esc(t('delPass'))}</label><input id="a-pass" type="password" class="input" autocomplete="current-password" required></div>
                <p id="a-msg" class="small danger" style="min-height:20px"></p>
                <button class="btn btn-danger btn-block" type="submit">${esc(t('delConfirm'))}</button>
            </form>
            <div class="auth-links"><button class="btn-link small" onclick="hideAuth()">${esc(t('cancel'))}</button></div>`;
    }

    // ---------- legal ----------
    const legalUrl = () => 'privacidad.html' + (state.lang === 'en' ? '#en' : '');
    function legalLinkHTML(cls = 'btn-link small') { return `<a class="${cls}" href="${legalUrl()}" target="_blank" rel="noopener">${esc(t('legalLink'))}</a>`; }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
