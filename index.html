    <style>
        /* ---------- Tokens ---------- */
        :root {
            color-scheme: light;
            --bg: #eef5ec; --surface: #ffffff; --surface-2: #e5efe3; --surface-3: #d6e6d4; --border: #d9e7d6;
            --text: #12302a; --muted: #52695f; --faint: #8aa197;
            --accent: #1e8150; --accent-strong: #176b42; --accent-soft: #dcf1e2; --accent-ink: #ffffff;
            --brand-1: #3db873; --brand-2: #2c8fb8; --gold: #e0a21f; --navy: #0f2b26; --pink: #e8557a; --pink-soft: #fde4eb;
            --warn: #a06400; --warn-soft: #fbefd3; --danger: #c9423f; --danger-soft: #fbe3e1; --info: #22789c; --info-soft: #ddeff6;
            --c-bills: #e0625e; --c-buffer: #e0a21f; --c-surplus: #2fa66a; --c-savings: #2c8fb8;
            --grid: #dfeadc; --ring-track: #dce9d9;
            --shadow: 0 1px 2px rgba(18, 48, 42, .05), 0 8px 24px -12px rgba(18, 48, 42, .18);
            --radius: 20px;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #0f2b26; --surface: #15362f; --surface-2: #1b4138; --surface-3: #234d43; --border: #24493f;
                --text: #eaf5ee; --muted: #a3bfb3; --faint: #6d8c80;
                --accent: #4ccb86; --accent-strong: #7fdda8; --accent-soft: rgba(76, 203, 134, .15); --accent-ink: #072117;
                --brand-1: #4ccb86; --brand-2: #4fb3dc; --gold: #f2b43c; --navy: #0f2b26; --pink: #ff6f91; --pink-soft: rgba(255, 111, 145, .15);
                --warn: #f2b43c; --warn-soft: rgba(242, 180, 60, .15); --danger: #ff7d7d; --danger-soft: rgba(255, 125, 125, .14); --info: #5ec3ea; --info-soft: rgba(94, 195, 234, .14);
                --c-bills: #ff8a7a; --c-buffer: #f2b43c; --c-surplus: #4ccb86; --c-savings: #5ec3ea;
                --grid: #1e443b; --ring-track: #1f463c;
                --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f2b26; --surface: #15362f; --surface-2: #1b4138; --surface-3: #234d43; --border: #24493f;
            --text: #eaf5ee; --muted: #a3bfb3; --faint: #6d8c80;
            --accent: #4ccb86; --accent-strong: #7fdda8; --accent-soft: rgba(76, 203, 134, .15); --accent-ink: #072117;
            --brand-1: #4ccb86; --brand-2: #4fb3dc; --gold: #f2b43c; --navy: #0f2b26; --pink: #ff6f91; --pink-soft: rgba(255, 111, 145, .15);
            --warn: #f2b43c; --warn-soft: rgba(242, 180, 60, .15); --danger: #ff7d7d; --danger-soft: rgba(255, 125, 125, .14); --info: #5ec3ea; --info-soft: rgba(94, 195, 234, .14);
            --c-bills: #ff8a7a; --c-buffer: #f2b43c; --c-surplus: #4ccb86; --c-savings: #5ec3ea;
            --grid: #1e443b; --ring-track: #1f463c;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px -14px rgba(0, 0, 0, .6);
        }

        /* ---------- Base ---------- */
        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
            background: var(--bg); color: var(--text); overflow-x: hidden;
            transition: background-color .3s ease, color .3s ease;
            padding-bottom: calc(88px + env(safe-area-inset-bottom));
        }
        @media (min-width: 900px) { body { padding-bottom: 48px; } }
        h1, h2, h3, h4, p { margin: 0; }
        button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
        input, select { font: inherit; color: inherit; }
        .serif { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; letter-spacing: -.02em; }
        .num { font-variant-numeric: tabular-nums; }
        .muted { color: var(--muted); } .faint { color: var(--faint); }
        .small { font-size: 13px; } .tiny { font-size: 12px; }
        .accent { color: var(--accent); } .warn { color: var(--warn); } .danger { color: var(--danger); }
        .hidden { display: none !important; }
        .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .row { display: flex; align-items: center; gap: 12px; }
        .between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .stack { display: flex; flex-direction: column; gap: 12px; }
        .wrap { flex-wrap: wrap; }
        .grow { flex: 1; min-width: 0; }
        .shrink-0 { flex-shrink: 0; }
        .mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 18px; } .mt-5 { margin-top: 24px; }
        .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 18px; }
        svg.lucide { width: 18px; height: 18px; stroke-width: 1.9; flex-shrink: 0; }

        /* ---------- Header ---------- */
        .header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
        .header-inner { max-width: 1120px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 16px; }
        @media (min-width: 640px) { .header-inner { padding: 16px 24px; } }
        .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .brand-mark { width: 40px; height: 40px; flex-shrink: 0; }
        .wordmark { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 23px; line-height: 1.05; letter-spacing: -.02em; }
        .wordmark span { background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .brand p { font-size: 12.5px; color: var(--muted); }
        .top-tabs { display: none; margin: 0 auto; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 2px; }
        @media (min-width: 900px) { .top-tabs { display: flex; } }
        .top-tabs button { padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s; }
        .top-tabs button:hover { color: var(--text); }
        .top-tabs button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
        .header-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
        @media (min-width: 900px) { .header-actions { margin-left: 0; } }
        .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
        .seg button { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); transition: background .2s, color .2s; }
        .seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
        .seg .flag { width: 20px; height: 14px; border-radius: 3px; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
        .seg .lbl { display: none; }
        @media (min-width: 480px) { .seg .lbl { display: inline; } }
        .icon-btn { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text); transition: background .2s, color .2s, transform .1s; }
        .icon-btn:hover { background: var(--surface-3); }
        .icon-btn:active { transform: scale(.96); }
        .icon-btn.sm { width: 32px; height: 32px; border-radius: 10px; background: transparent; color: var(--faint); }
        .icon-btn.sm:hover { background: var(--surface-2); color: var(--text); }
        .icon-btn.sm.del:hover { background: var(--danger-soft); color: var(--danger); }

        /* ---------- Bottom nav (mobile) ---------- */
        .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
        @media (min-width: 900px) { .bottom-nav { display: none; } }
        .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0; border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--faint); transition: color .2s; position: relative; }
        .bottom-nav button svg.lucide { width: 22px; height: 22px; }
        .bottom-nav button.active { color: var(--accent); }
        .bottom-nav button.active::before { content: ''; position: absolute; top: 0; width: 34px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
        .badge-dot { position: absolute; top: 5px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--surface); }

        /* ---------- Layout ---------- */
        main { max-width: 1120px; margin: 0 auto; padding: 20px 16px 0; }
        @media (min-width: 640px) { main { padding: 28px 24px 0; } }
        .tab { display: none; }
        .tab.active { display: block; }
        .tab-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 900px) {
            .tab-grid.two { grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: start; }
            .tab-grid.two-even { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
            .span-2 { grid-column: 1 / -1; }
        }
        .col { display: grid; gap: 18px; min-width: 0; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); min-width: 0; transition: background-color .3s, border-color .3s; }
        @media (min-width: 640px) { .card { padding: 24px; } }
        .card-title { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; letter-spacing: -.01em; font-size: 19px; line-height: 1.2; display: flex; align-items: center; gap: 10px; }
        .card-title svg.lucide { color: var(--accent); width: 20px; height: 20px; }
        .card-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
        .eyebrow { font-size: 13px; font-weight: 600; color: var(--muted); }
        .divider { height: 1px; background: var(--border); margin: 18px 0; }

        /* entrance animation */
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .tab.active .anim { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
        .tab.active .anim:nth-child(2) { animation-delay: .05s; } .tab.active .anim:nth-child(3) { animation-delay: .1s; }
        .tab.active .anim:nth-child(4) { animation-delay: .15s; } .tab.active .anim:nth-child(5) { animation-delay: .2s; }
        .tab.active .anim:nth-child(6) { animation-delay: .25s; }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

        /* ---------- Controls ---------- */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; font-size: 14px; font-weight: 600; transition: background .2s, color .2s, transform .1s, box-shadow .2s; white-space: nowrap; }
        .btn:active { transform: scale(.98); }
        .btn-primary { background: var(--accent); color: var(--accent-ink); }
        .btn-primary:hover { background: var(--accent-strong); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-soft { background: var(--accent-soft); color: var(--accent); }
        .btn-soft:hover { background: var(--accent); color: var(--accent-ink); }
        .btn-ghost { background: var(--surface-2); color: var(--text); }
        .btn-ghost:hover { background: var(--surface-3); }
        .btn-link { color: var(--accent); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0; }
        .btn-link:hover { text-decoration: underline; }
        .btn-sm { padding: 7px 13px; font-size: 13px; border-radius: 10px; }
        .btn-block { width: 100%; }
        .label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
        .input { width: 100%; background: var(--surface-2); border: 1.5px solid transparent; border-radius: 12px; padding: 12px 14px; font-size: 15px; transition: border-color .2s, background .2s; }
        .input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
        .input.invalid { border-color: var(--danger); }
        .input::placeholder { color: var(--faint); }
        select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .form-grid .full { grid-column: 1 / -1; }
        .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
        .pill.ok { background: var(--accent-soft); color: var(--accent); }
        .pill.warn { background: var(--warn-soft); color: var(--warn); }
        .pill.danger { background: var(--danger-soft); color: var(--danger); }
        .note { border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.5; }
        .note.ok { background: var(--accent-soft); color: var(--accent); }
        .note.warn { background: var(--warn-soft); color: var(--warn); }
        .note.danger { background: var(--danger-soft); color: var(--danger); }
        .note.plain { background: var(--surface-2); color: var(--muted); }

        /* ---------- Hero ---------- */
        .hero { display: grid; gap: 22px; align-items: center; grid-template-columns: minmax(0, 1fr); }
        @media (min-width: 560px) { .hero { grid-template-columns: auto minmax(0, 1fr); gap: 28px; } }
        .ring-wrap { position: relative; width: 210px; height: 210px; margin: 0 auto; }
        .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring-track { stroke: var(--ring-track); }
        .ring-fg { transition: stroke-dashoffset 1s cubic-bezier(.2, .7, .2, 1), stroke .4s; stroke: var(--accent); }
        .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; }
        .ring-center .big { font-size: 34px; line-height: 1.05; margin: 4px 0 2px; }
        .hero-msg { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 19px; line-height: 1.3; }
        .stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .stat { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
        .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
        .bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; position: relative; }
        .bar > span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand-1), var(--brand-2)); transition: width 1s cubic-bezier(.2, .7, .2, 1), background .4s; width: 0; }
        .bar.thin { height: 6px; }
        .bar.thick { height: 12px; }

        /* ---------- Spending ---------- */
        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; padding: 10px 8px; border-radius: 14px; background: var(--surface-2); border: 1.5px solid transparent; font-size: 12.5px; font-weight: 600; color: var(--muted); transition: background .2s, border-color .2s, color .2s, transform .1s; }
        .chip .e { font-size: 22px; line-height: 1; }
        .chip:hover { background: var(--surface-3); }
        .chip:active { transform: scale(.96); }
        .chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
        .spend-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
        .spend-form .note-in { grid-column: 1 / -1; order: 3; }
        @media (min-width: 560px) { .spend-form { grid-template-columns: 160px minmax(0, 1fr) auto; } .spend-form .note-in { grid-column: auto; order: 0; } }
        .amount-in { font-size: 18px; font-weight: 700; }
        .list-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); min-width: 0; }
        .list-row + .list-row { margin-top: 6px; }
        .emoji-badge { width: 36px; height: 36px; border-radius: 11px; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }

        /* ---------- Obligations ---------- */
        .ob-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; column-gap: 14px; row-gap: 10px; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid transparent; min-width: 0; transition: border-color .2s; }
        .ob-row.full { grid-template-columns: 48px minmax(0, 1fr); }
        .ob-row.full .ob-side { grid-column: 2; justify-content: space-between; }
        .ob-row.full .date-badge { align-self: start; }
        .ob-row + .ob-row { margin-top: 8px; }
        .ob-row.overdue { border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
        .ob-row.soon { border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
        .ob-row.done { opacity: .62; }
        .ob-row.done .ob-name { text-decoration: line-through; }
        .date-badge { width: 48px; flex-shrink: 0; border-radius: 12px; background: var(--surface); text-align: center; padding: 6px 0; line-height: 1.1; }
        .date-badge .d { font-size: 18px; font-weight: 700; }
        .date-badge .m { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
        .ob-main { min-width: 0; }
        .ob-name { font-weight: 700; font-size: 15px; }
        .ob-side { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .ob-side .acts { display: flex; align-items: center; gap: 4px; }
        .ob-amount { font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 600; font-size: 17px; margin-right: 6px; }

        /* ---------- Calendar ---------- */
        .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
        .cal .wd { text-align: center; font-size: 12px; font-weight: 600; color: var(--faint); padding: 2px 0 6px; text-transform: capitalize; }
        .cal .day { aspect-ratio: 1 / 1; border-radius: 12px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 6px; position: relative; border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .1s; min-width: 0; }
        @media (min-width: 640px) { .cal .day { aspect-ratio: 1.15 / 1; } .cal { gap: 7px; } }
        .cal .day:hover { background: var(--surface-3); }
        .cal .day:active { transform: scale(.96); }
        .cal .day.empty { background: transparent; pointer-events: none; }
        .cal .day.past .n { color: var(--faint); }
        .cal .day .n { font-size: 14px; font-weight: 600; }
        .cal .day.today { border-color: var(--accent); }
        .cal .day.today .n { color: var(--accent); font-weight: 800; }
        .cal .day.sel { background: var(--accent); }
        .cal .day.sel .n, .cal .day.sel .sp { color: var(--accent-ink) !important; }
        .cal .dots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
        .cal .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--info); }
        .cal .day.sel .dot { box-shadow: 0 0 0 1.5px var(--accent-ink); }

        .ob-wrap { position: relative; max-width: 460px; margin: 0 auto; min-height: 100%; padding: calc(14px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }

    let STORAGE_KEY = 'arch_pro_v9'; // per-user in the web version
    const SYMBOL_TO_CODE = { 'Q': 'GTQ', '$': 'USD', '€': 'EUR', 'L': 'HNL', '₡': 'CRC', '£': 'GBP' };

    function periodKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
    function defaults() {

            version: 12, income: 0, currencyCode: 'USD',

            ...moneyDefaults()

    }

    let activePaymentId = null;
    let editingId = null;

    function loadState() {
        let saved = null;

        if (!saved || typeof saved !== 'object') return;
        state = migrate(saved);
    }

    // Data can arrive from a backup file, a transfer code or the server: ids and periods end up inside
    // onclick="…" attributes, so only allow plain characters there (prevents script injection).
    const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
    function sid(v) { const x = String(v ?? ''); return SAFE_ID.test(x) ? x : uid(); }
    function okPeriod(p) { return typeof p === 'string' && /^\d{4}-\d{2}$/.test(p); }
    function safeEmoji(e, dflt) { const x = String(e || '').replace(/[<>"'&\\`=\s]/g, ''); return x && [...x].length <= 4 ? x : dflt; }
    function migrate(s) {
        if (!s || typeof s !== 'object' || Array.isArray(s)) s = {};
        const d = defaults();
        const out = { ...d, ...s };
        if (!s.currencyCode) out.currencyCode = SYMBOL_TO_CODE[(s.currency || '').trim()] || 'USD';
        if (!s.period) {
            const now = new Date();
            out.period = (typeof s.lastResetMonth === 'number' && s.lastResetMonth !== now.getMonth()) ? '0000-00' : periodKey(now);
        }
        delete out.currency; delete out.lastResetMonth;
        out.items = (Array.isArray(s.items) ? s.items : []).map(i => ({
            id: sid(i.id), type: i.type === 'debt' ? 'debt' : 'fixed', subtype: i.subtype === 'loan' ? 'loan' : i.subtype === 'cc' ? 'cc' : null,
            name: String(i.name || '—'), amount: +i.amount || 0, date: clampInt(i.date, 1, 31, 1),
            balance: +i.balance || 0, startBalance: +(i.startBalance ?? i.balance) || 0, apr: +i.apr || 0,
            totalMonths: +i.totalMonths || 0, monthsPaid: +i.monthsPaid || 0,
            paid: !!i.paid, completed: !!i.completed, extraPaid: +i.extraPaid || 0, lastPay: i.lastPay || null,

        }));

        out.planMethod = s.planMethod === 'snowball' ? 'snowball' : 'avalanche';
        out.planExtra = (s.planExtra === null || s.planExtra === undefined || isNaN(+s.planExtra)) ? null : Math.max(0, +s.planExtra);
        out.consExcluded = Array.isArray(s.consExcluded) ? s.consExcluded.map(String).filter(x => SAFE_ID.test(x)) : [];
        out.offers = (Array.isArray(s.offers) ? s.offers : []).filter(o => o && +o.term >= 1).map(o => ({
            id: sid(o.id), name: String(o.name || '—'), rate: Math.max(0, +o.rate || 0), term: Math.round(+o.term),

        if (!['system', 'light', 'dark'].includes(out.theme)) out.theme = 'system';
        if (!TABS.includes(out.tab)) out.tab = 'today';

    function saveState() { persist(); }

    function monthsBetween(a, b) {
        if (a === '0000-00') return 1;
        const [ya, ma] = a.split('-').map(Number), [yb, mb] = b.split('-').map(Number);
        return (yb - ya) * 12 + (mb - ma);
    }

    function archiveEntry(i, period) {
        const paidTotal = (i.history || []).reduce((a, h) => a + h.amount + (h.extra || 0), 0);
        return { id: i.id, name: i.name, total: i.startBalance || paidTotal, paidTotal, period, months: (i.history || []).length };
    }

    // Runs every render, so a tab left open across the 1st still rolls over.
    function checkRollover() {
        const now = periodKey();
        if (state.period === now) return;
        const elapsed = Math.max(1, monthsBetween(state.period, now));
        if (state.period !== '0000-00') {
            const r = snapshotMonth(state.period);
            if (r) {
                state.months = [...state.months.filter(m => m.period !== state.period), r.snap].slice(-24);
                state.streakCarry = elapsed === 1 ? r.streak : 0;
                if (r.snap.spent > 0 || r.snap.debtPaid > 0 || r.snap.income > 0) state.pendingRecap = state.period;
            }
        }
        state.items.filter(i => i.completed && i.type === 'debt').forEach(i => state.archive.push(archiveEntry(i, state.period)));
        state.items = state.items.filter(i => !i.completed);
        state.items.forEach(i => {
            // Statement cards follow their own cut/due cycle (rollStatements), not the calendar month.
            if (i.stmt) { i.extraPaid = 0; return; }
            if (i.subtype === 'cc' && i.balance > 0 && i.apr > 0) {
                for (let k = 0; k < elapsed; k++) i.balance = round2(i.balance * (1 + i.apr / 1200));
            }
            i.paid = false; i.extraPaid = 0; i.lastPay = null;
        });
        const keep = new Set([0, 1, 2].map(k => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - k); return periodKey(d); }));
        state.expenses = state.expenses.filter(e => keep.has(e.period));
        state.period = now;
    }

    // ================= Helpers =================
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function round2(n) { return Math.round(n * 100) / 100; }

    function fmt(n, dec = 2) {
        try {
            return new Intl.NumberFormat(LOCALES[state.lang], { style: 'currency', currency: state.currencyCode, minimumFractionDigits: dec, maximumFractionDigits: dec }).format(n || 0);
        } catch (e) { return (n || 0).toFixed(dec); }
    }
    function fmtCompact(n) {
        try {
            return new Intl.NumberFormat(LOCALES[state.lang], { style: 'currency', currency: state.currencyCode, notation: 'compact', maximumFractionDigits: 1 }).format(n || 0);
        } catch (e) { return String(Math.round(n)); }
    }
    function daysInMonth(d = new Date()) { return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); }
    function dueDay(item, d = new Date()) { return Math.min(item.date, daysInMonth(d)); }
    function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    function catOf(id) { return CATS.find(c => c.id === id) || CATS[CATS.length - 1]; }
    const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // compute() lives in money.js (pay periods + extra income)

    function itemProgress(i) {
        if (i.type !== 'debt') return null;
        if (i.startBalance > 0) return Math.min(100, Math.max(0, (1 - i.balance / i.startBalance) * 100));
        if (i.subtype === 'loan' && i.totalMonths) return Math.min(100, (i.monthsPaid / i.totalMonths) * 100);
        return i.completed ? 100 : null;
    }

    // ================= Debt simulation =================
    function activeDebts() {
        return state.items.filter(i => i.type === 'debt' && !i.completed).map(i => {
            const remainingMonths = i.subtype === 'loan' && i.totalMonths ? Math.max(0, i.totalMonths - i.monthsPaid) : 0;
            if (i.balance > 0) return { id: i.id, name: i.name, bal: i.balance, apr: i.apr, min: i.amount, approx: false, date: i.date };
            if (remainingMonths > 0) return { id: i.id, name: i.name, bal: i.amount * remainingMonths, apr: 0, min: i.amount, approx: true, date: i.date };
            return null;
        }).filter(Boolean);
    }

    const MAX_MONTHS = 600;
    // rollover=true: extra + installments freed by paid-off debts go to the priority debt.
    function simulate(debts, extra, method, rollover, lumps) {
        const ds = debts.map(d => ({ ...d, b: d.bal, r: d.apr / 1200, paidMonth: null }));
        const series = [ds.reduce((a, d) => a + d.b, 0)];
        let month = 0, interest = 0, paid = 0;
        const alive = () => ds.filter(d => d.b > 0.005);
        while (alive().length && month < MAX_MONTHS) {
            month++;
            let pool = rollover ? extra + ds.filter(d => d.paidMonth !== null).reduce((a, d) => a + d.min, 0) + ((lumps && lumps[month]) || 0) : 0;
            alive().forEach(d => { const it = d.b * d.r; d.b += it; interest += it; });
            alive().forEach(d => {
                const p = Math.min(d.b, d.min);
                d.b -= p; paid += p;
                if (rollover) pool += d.min - p;
            });
            if (rollover && pool > 0) {
                const order = alive().sort(method === 'snowball'
                    ? (a, b) => (a.b - b.b) || (b.r - a.r)
                    : (a, b) => (b.r - a.r) || (a.b - b.b));
                for (const d of order) {
                    if (pool <= 0) break;
                    const p = Math.min(d.b, pool);
                    d.b -= p; pool -= p; paid += p;
                }
            }
            ds.forEach(d => { if (d.paidMonth === null && d.b <= 0.005) { d.b = 0; d.paidMonth = month; } });
            series.push(Math.max(0, ds.reduce((a, d) => a + d.b, 0)));
        }
        return { months: month, interest, paid, series, debts: ds, stuck: alive().length > 0 };
    }

    // Month index 1 = the next installment (this month if one is still pending).
    function monthLabel(n, style = 'short') {
        const pending = state.items.some(i => i.type === 'debt' && !i.paid && !i.completed);
        const d = new Date(); d.setDate(1);
        d.setMonth(d.getMonth() + n - (pending ? 1 : 0));
        return d.toLocaleDateString(LOCALES[state.lang], { month: style, year: 'numeric' });
    }
    function periodLabel(p) {
        const [y, m] = p.split('-').map(Number);
        if (!y || !m) return '';
        return new Date(y, m - 1, 1).toLocaleDateString(LOCALES[state.lang], { month: 'long', year: 'numeric' });
    }

    function planExtraValue(c) { return state.planExtra === null ? Math.round(c.surplus) : state.planExtra; }
    function getPlan(c) {
        const debts = activeDebts();
        if (!debts.length) return null;
        const extra = planExtraValue(c);
        return { debts, extra, plan: simulate(debts, extra, state.planMethod, true), base: simulate(debts, 0, state.planMethod, true) };
    }

    // ================= Consolidation =================
    function selectedDebts() { return activeDebts().filter(d => !state.consExcluded.includes(d.id)); }

    function evalOffer(o, sel) {
        const owed = sel.reduce((a, d) => a + d.bal, 0);
        const fee = owed * o.feePct / 100;
        const principal = owed + (o.feeFinanced ? fee : 0);
        const r = o.rate / 1200, n = o.term;
        const installment = r > 0 ? principal * r / (1 - Math.pow(1 + r, -n)) : principal / n;
        const monthly = installment + o.insurance;
        const total = monthly * n + (o.feeFinanced ? 0 : fee);
        // Real annual cost: rate where what you effectively receive equals what you pay (fee + insurance included)
        const received = owed - (o.feeFinanced ? 0 : fee);
        const pv = x => { let s = 0; for (let k = 1; k <= n; k++) s += monthly / Math.pow(1 + x, k); return s; };
        let lo = 0, hi = 1;
        if (pv(0) <= received) hi = 0;
        for (let k = 0; k < 80 && hi > 0; k++) { const mid = (lo + hi) / 2; if (pv(mid) > received) lo = mid; else hi = mid; }
        const eff = (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100;
        const currentPay = sel.reduce((a, d) => a + d.min, 0);
        // Fair comparison: current debts paid with the same monthly cash (never less than today's installments)
        const comparePay = Math.max(currentPay, monthly);
        const baseline = simulate(sel, comparePay - currentPay, 'avalanche', true);
        return { comparePay, principal, monthly, total, eff, installment,
                 save: baseline.stuck ? Infinity : baseline.paid - total, payDiff: monthly - currentPay };
    }

    // ================= Export / Import =================
    // Inside the Claude viewer, files go through the downloads capability; a saved local copy uses a plain link.
    let downloadsNS = null;
    const inViewer = () => !!(window.claude && typeof window.claude.use === 'function');
    if (inViewer()) window.claude.use('downloads').then(ns => { downloadsNS = ns; }).catch(() => {});
    async function download(content, filename, type) {
        if (inViewer()) {
            if (!downloadsNS) { toast(t('downloadUnavailable')); return false; }
            try { await downloadsNS.save({ filename, data: content }); return true; }
            catch (e) { if (e && e.code !== 'declined') toast(t('downloadUnavailable')); return false; }
        }
        const url = URL.createObjectURL(new Blob([content], { type }));
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        return true;
    }

    function exportBackup() { download(JSON.stringify(state, null, 2), `valiu-${state.period}.json`, 'application/json'); }

    function importBackup(ev) {
        const file = ev.target.files[0];
        ev.target.value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const data = JSON.parse(reader.result);
                if (!data || !Array.isArray(data.items)) throw new Error('bad');
                state = migrate(data);
                resetCharts();
                render(); closeModal('config-modal'); toast(t('backupOk'));
            } catch (e) { toast(t('backupBad')); }
        };
        reader.readAsText(file);
    }

    function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
    function icsDate(d) { return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`; }

    function exportICS() {
        if (inViewer()) { openCalendarLinks(); return; }
        const active = state.items.filter(i => !i.completed);
        if (!active.length) { toast(t('icsEmpty')); return; }
        const now = new Date();
        const stamp = now.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Valiu//Budget//' + state.lang.toUpperCase(), 'CALSCALE:GREGORIAN'];
        active.forEach(i => {
            let first = new Date(now.getFullYear(), now.getMonth(), 1);
            if (i.paid || dueDay(i, first) < now.getDate()) first = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            first.setDate(dueDay(i, first));
            const end = new Date(first); end.setDate(end.getDate() + 1);
            // Days 29–31: "last available day up to N" so short months don't skip the reminder
            const byDay = i.date > 28 ? `BYMONTHDAY=${Array.from({ length: i.date - 27 }, (_, k) => 28 + k).join(',')};BYSETPOS=-1` : `BYMONTHDAY=${i.date}`;
            let rrule = `RRULE:FREQ=MONTHLY;${byDay}`;
            if (i.subtype === 'loan' && i.totalMonths) {
                const remaining = i.totalMonths - i.monthsPaid;
                if (remaining <= 0) return;
                rrule += `;COUNT=${remaining}`;
            }
            lines.push('BEGIN:VEVENT', `UID:${i.id}@valiu`, `DTSTAMP:${stamp}`,
                `DTSTART;VALUE=DATE:${icsDate(first)}`, `DTEND;VALUE=DATE:${icsDate(end)}`, rrule,
                `SUMMARY:${icsEscape(t('icsPay', { name: i.name }) + ' (' + fmt(i.amount) + ')')}`,
                `DESCRIPTION:${icsEscape(t('icsDesc', { amount: fmt(i.amount) }))}`,
                'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:-P1D', `DESCRIPTION:${icsEscape(t('icsPay', { name: i.name }))}`, 'END:VALARM',
                'END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        download(lines.join('\r\n') + '\r\n', 'budget_ledger.ics', 'text/calendar');
    }

    // ================= Extended state =================
    const GOAL_EMOJIS = ['🎯', '✈️', '🚗', '🏠', '🎓', '💍', '👶', '💻', '🏖️', '🎄', '🩺', '🐶'];
    const LENDERS = [
        { name: 'Cooperativas (MICOOPE / FENACOAC)', type: 'coop', lo: 18, hi: 25 },
        { name: 'G&T Continental', type: 'bank', lo: 21, hi: 33 },
        { name: 'Banrural', type: 'bank', lo: 22, hi: 35 },
        { name: 'Banco Industrial', type: 'bank', lo: 22, hi: 36 },
        { name: 'Promerica', type: 'bank', lo: 28, hi: 35 },
        { name: 'BAM', type: 'bank', lo: 30, hi: 38 }
    ];
    const BANK_LO = 21, BANK_HI = 38, COOP_LO = 18, COOP_HI = 25;

    function moneyDefaults() {
        return {
            payFreq: 'monthly', incomeType: 'fixed', payDays: [], paySplit: [], payWeekday: 5, taxPct: 0, incomes: [], goals: [], catLimits: {},
            bonus: { b14: null, agui: null, split: { debt: 50, save: 30, fun: 20 } },
            months: [], startedAt: Date.now(), streakCarry: 0, bestStreak: 0,
            pinHash: null, pinSalt: null, pinLen: 0, pendingRecap: null,
            inv: { amount: 10000, rate: '', years: 5 }, updatedAt: 0
        };
    }

    function migrateMoney(s, out) {
        const d = moneyDefaults();
        migrateIncome(s, out);
        out.incomes = (Array.isArray(s.incomes) ? s.incomes : []).filter(x => x && +x.amount > 0).map(x => ({
            id: sid(x.id), amount: +x.amount, note: String(x.note || '').slice(0, 120), ts: +x.ts || Date.now(),
            period: okPeriod(x.period) ? x.period : periodKey(new Date(+x.ts || Date.now())), dest: /^(spend|debt|savings|goal:[A-Za-z0-9_-]{1,40})$/.test(String(x.dest)) ? String(x.dest) : 'spend', bonus: x.bonus || null
        }));
        out.goals = (Array.isArray(s.goals) ? s.goals : []).filter(g => g && g.name).map(g => ({
            id: sid(g.id), name: String(g.name).slice(0, 60), emoji: safeEmoji(g.emoji, '🎯'), target: Math.max(0, +g.target || 0),
            saved: Math.max(0, +g.saved || 0), due: /^\d{4}-\d{2}$/.test(g.due || '') ? g.due : null, kind: g.kind === 'emergency' ? 'emergency' : 'custom',
            history: Array.isArray(g.history) ? g.history.filter(h => h && +h.ts) : []
        }));
        out.catLimits = {};
        if (s.catLimits && typeof s.catLimits === 'object') Object.entries(s.catLimits).forEach(([k, v]) => { if (CAT_IDS.has(k) && +v > 0) out.catLimits[k] = +v; });
        const b = s.bonus || {};
        const sp = b.split || {};
        out.bonus = { b14: +b.b14 > 0 ? +b.b14 : null, agui: +b.agui > 0 ? +b.agui : null,
            split: { debt: clampInt(sp.debt, 0, 100, 50), save: clampInt(sp.save, 0, 100, 30), fun: 0 } };
        out.bonus.split.save = Math.min(out.bonus.split.save, 100 - out.bonus.split.debt);
        out.bonus.split.fun = 100 - out.bonus.split.debt - out.bonus.split.save;
        out.months = (Array.isArray(s.months) ? s.months : []).filter(m => m && okPeriod(m.period)).slice(-24);
        const earliest = Math.min(...[...(out.expenses || []).map(e => e.ts), Date.now()]);
        out.startedAt = +s.startedAt || earliest;
        out.streakCarry = Math.max(0, +s.streakCarry || 0);
        out.bestStreak = Math.max(0, +s.bestStreak || 0);
        out.pinHash = typeof s.pinHash === 'string' ? s.pinHash : null;
        out.pinSalt = typeof s.pinSalt === 'string' ? s.pinSalt : null;
        out.pinLen = clampInt(s.pinLen, 0, 6, out.pinHash ? 4 : 0);
        out.pendingRecap = okPeriod(s.pendingRecap) ? s.pendingRecap : null;
        const inv = s.inv || {};
        out.inv = { amount: +inv.amount > 0 ? +inv.amount : d.inv.amount, rate: inv.rate === '' || inv.rate == null ? '' : +inv.rate, years: clampInt(inv.years, 1, 30, 5) };
        out.updatedAt = +s.updatedAt || 0;
    }

    // ================= Income & budget =================
    function extraIncomeFor(period) {
        const r = { spend: 0, debt: 0, save: 0, total: 0 };
        state.incomes.filter(x => x.period === period).forEach(x => {
            r.total += x.amount;
            if (x.dest === 'spend') r.spend += x.amount;
            else if (x.dest === 'debt') r.debt += x.amount;
            else r.save += x.amount;
        });
        return r;
    }

    function compute(ref = new Date()) {
        const now = ref, dim = daysInMonth(now), day = now.getDate();
        const daysRemaining = dim - day + 1;
        const income = state.income;
        const ex = extraIncomeFor(state.period);

        // All of this month's commitments stay locked in, so paying a bill never moves the daily limit.
        // Flexible income that is invoiced: the tax reserve is set aside like a fixed bill.
        const taxes = monthlyTaxes();
        const fixed = state.items.reduce((a, i) => a + i.amount, 0) + taxes;
        const afterFixed = Math.max(0, income - fixed);
        const plan = effectivePlan(income, fixed);
        const baseBuffer = Math.min(income * plan.b / 100, afterFixed);
        const remainder = afterFixed - baseBuffer;
        const baseSurplus = remainder * plan.s / 100;
        const buffer = baseBuffer + ex.spend;
        const surplus = baseSurplus + ex.debt;
        const savings = remainder - baseSurplus + ex.save;

        const extraPaid = state.items.reduce((a, i) => a + (i.extraPaid || 0), 0);
        const surplusLeft = Math.max(0, surplus - extraPaid);
        const extraFromBuffer = Math.max(0, extraPaid - surplus);
        const monthExp = state.expenses.filter(e => e.period === state.period);
        const spent = monthExp.reduce((a, e) => a + e.amount, 0);
        const spentToday = monthExp.filter(e => sameDay(new Date(e.ts), now)).reduce((a, e) => a + e.amount, 0);
        const bufferLeft = buffer - spent - extraFromBuffer;

        // Pay periods follow the user's paydays (see paySchedule); unspent money carries into the next one.
        const sch = paySchedule(now), seg = sch.at(day);
        const biw = !(seg.start === 1 && seg.end === dim);
        const inQ1 = biw && seg.end < dim;
        const periodEnd = seg.end;
        const allocated = buffer * seg.cum;
        const periodDaysLeft = periodEnd - day + 1;
        const periodLeft = allocated - spent - extraFromBuffer;

        // Today's budget is fixed at the start of the day; spending today eats into it.
        const leftAtDayStart = allocated - (spent - spentToday) - extraFromBuffer;
        const dailyBudget = Math.max(0, leftAtDayStart / periodDaysLeft);
        const todayLeft = dailyBudget - spentToday;
        const dsl = Math.max(0, periodLeft / periodDaysLeft);

        const goalSavedMonth = state.goals.reduce((a, g) => a + g.history.filter(h => periodKey(new Date(h.ts)) === state.period && h.amount > 0 && !h.incomeId).reduce((s, h) => s + h.amount, 0), 0);

        return { income, fixed, baseBuffer, buffer, surplus, savings, extraPaid, surplusLeft, extraFromBuffer, spent, spentToday,
                 bufferLeft, dailyBudget, todayLeft, dsl, daysRemaining, monthExp, ex, biw, inQ1, periodEnd, periodDaysLeft,
                 allocated, periodLeft, goalSavedMonth, taxes, sch, plan };
    }

    // ================= Streak =================
    // Consecutive days spent within that day's limit, counted back from yesterday (or ref day when inclusive).
    function streakFor(ref, c, inclusive) {
        if (!(c.buffer > 0)) return 0;
        const dim = daysInMonth(ref), endDay = ref.getDate();
        const byDay = {};
        c.monthExp.forEach(e => { const d = new Date(e.ts).getDate(); byDay[d] = (byDay[d] || 0) + e.amount; });
        const started = new Date(state.startedAt);
        const startedHere = started.getFullYear() === ref.getFullYear() && started.getMonth() === ref.getMonth();
        const startedLater = started > ref && !startedHere;
        if (startedLater) return 0;
        const firstDay = startedHere ? started.getDate() : 1;
        const within = d => {
            const sg = (c.sch || paySchedule(ref)).at(d);
            const pEnd = sg.end;
            const alloc = c.buffer * sg.cum;
            let before = 0; for (let k = 1; k < d; k++) before += byDay[k] || 0;
            const budget = Math.max(0, (alloc - before) / (pEnd - d + 1));
            return (byDay[d] || 0) <= budget + 0.005;
        };
        let n = 0;
        for (let d = inclusive ? endDay : endDay - 1; d >= firstDay; d--) { if (within(d)) n++; else return n; }
        if (!startedHere) n += state.streakCarry;
        return n;
    }
    function currentStreak(c) {
        if (!(c.buffer > 0)) return 0;
        if (c.todayLeft < -0.005) return 0;
        const n = streakFor(new Date(), c, false) + 1;
        if (n > state.bestStreak) state.bestStreak = n;
        return n;
    }

    // ================= Month snapshot (called by rollover before the reset) =================
    function snapshotMonth(oldPeriod) {
        const [y, m] = oldPeriod.split('-').map(Number);
        if (!y || !m) return null;
        const ref = new Date(y, m, 0, 23, 59);
        const c = compute(ref);
        const byCat = {};
        c.monthExp.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; });
        const debtTotal = activeDebts().reduce((a, d) => a + d.bal, 0);
        const debtPaid = state.items.filter(i => i.type === 'debt').reduce((a, i) => a + (i.history || []).filter(h => periodKey(new Date(h.ts)) === oldPeriod).reduce((s, h) => s + h.amount + (h.extra || 0), 0), 0);
        const goalSaved = state.goals.reduce((a, g) => a + g.history.filter(h => periodKey(new Date(h.ts)) === oldPeriod).reduce((s, h) => s + h.amount, 0), 0);
        const overCats = Object.entries(byCat).filter(([k, v]) => state.catLimits[k] && v > state.catLimits[k]).map(([k]) => k);
        const streak = streakFor(ref, c, true);
        return { snap: { period: oldPeriod, income: c.income, fixed: c.fixed, buffer: c.buffer, spent: c.spent, byCat, debtTotal, debtPaid,
                         extraIncome: c.ex.total, savings: c.savings, goalSaved, overCats, streak }, streak };
    }

    function monthsInBudgetStreak() {
        let n = 0;
        for (let k = state.months.length - 1; k >= 0; k--) { const s = state.months[k]; if (s.buffer > 0 && s.spent <= s.buffer) n++; else break; }
        return n;
    }

    // ================= Bonuses =================
    function nextBonus(kind) {
        const now = new Date();
        const month = kind === 'b14' ? 6 : 11, day = 15;
        // Still counts as "this year" through the end of the bonus month.
        const d = new Date(now.getFullYear() + (now.getMonth() > month ? 1 : 0), month, day);
        const thisMonth = now.getMonth() === month;
        const days = Math.max(0, Math.ceil((d - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000));
        const monthDiff = (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth();
        return { date: d, days, thisMonth, monthDiff };
    }
    function bonusAmount(kind) { const v = state.bonus[kind]; return v === null ? (state.incomeType !== 'fixed' ? 0 : state.income) : v; }
    function bonusImpact(kind, c) {
        const P = getPlan(c);
        if (!P) return null;
        const nb = nextBonus(kind);
        const toDebt = bonusAmount(kind) * state.bonus.split.debt / 100;
        if (!(toDebt > 0)) return { toDebt: 0, sooner: 0, saved: 0 };
        const pending = state.items.some(i => i.type === 'debt' && !i.paid && !i.completed);
        const idx = Math.max(1, nb.monthDiff + (pending ? 1 : 0));
        const withB = simulate(P.debts, P.extra, state.planMethod, true, { [idx]: toDebt });
        return { toDebt, sooner: P.plan.stuck ? 0 : Math.max(0, P.plan.months - withB.months), saved: Math.max(0, P.plan.interest - withB.interest) };
    }

    // ================= Goals =================
    function emergencyGoal() { return state.goals.find(g => g.kind === 'emergency'); }
    function emergencyTarget() {
        const c = compute();
        return Math.round((state.incomeType !== 'fixed' ? 6 : 3) * (c.fixed - c.taxes + c.baseBuffer) / 100) * 100;
    }
    function goalMonthly(g) {
        if (!g.due || g.saved >= g.target) return null;
        const [y, m] = g.due.split('-').map(Number), now = new Date();
        const months = (y - now.getFullYear()) * 12 + (m - 1 - now.getMonth()) + 1;
        if (months <= 0) return { late: true };
        return { perMonth: (g.target - g.saved) / months, months };
    }
    function goalAdd(g, amount, meta = {}) {
        const before = g.saved;
        g.saved = round2(Math.max(0, g.saved + amount));
        g.history.push({ ts: Date.now(), amount: round2(g.saved - before), ...meta });
        return before < g.target && g.saved >= g.target && g.target > 0;
    }

    // ================= Investing =================
    function readiness() {
        const debts = state.items.filter(i => i.type === 'debt' && !i.completed);
        const ef = emergencyGoal();
        const consistent = monthsInBudgetStreak();
        const items = [
            { key: 'chkCards', ok: !debts.some(i => i.subtype === 'cc' && i.balance > 0) },
            { key: 'chkExpensive', ok: !debts.some(i => i.apr > 15 && (i.balance > 0 || i.monthsPaid < i.totalMonths)) },
            { key: 'chkEmergency', ok: !!ef && ef.target > 0 && ef.saved >= ef.target },
            { key: 'chkConsistent', ok: consistent >= 3, n: Math.min(3, consistent) }
        ];
        return { items, done: items.filter(x => x.ok).length };
    }

    // ================= Exports =================
    function exportCSV() {
        const rows = [[t('csvDate'), t('csvType'), t('csvCategory'), t('csvNote'), t('csvAmount')]];
        const d = ts => new Date(ts).toISOString().slice(0, 10);
        state.expenses.forEach(e => rows.push([d(e.ts), t('csvExpense'), t('cat_' + e.cat), e.note, -e.amount]));
        state.items.forEach(i => (i.history || []).forEach(h => rows.push([d(h.ts), t('csvPayment'), i.name, h.extra ? t('historyExtra', { x: h.extra }) : '', -(h.amount + (h.extra || 0))])));
        state.incomes.forEach(x => rows.push([d(x.ts), t('csvIncome'), destLabel(x.dest), x.note, x.amount]));
        state.goals.forEach(g => g.history.forEach(h => rows.push([d(h.ts), t('csvGoal'), g.name, '', h.amount])));
        rows.splice(1, rows.length - 1, ...rows.slice(1).sort((a, b) => a[0] < b[0] ? 1 : -1));
        const csv = rows.map(r => r.map(v => {
            const s = typeof v === 'number' ? v.toFixed(2) : String(v ?? '');
            return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        }).join(',')).join('\r\n');
        download('﻿' + csv, `valiu-${state.period}.csv`, 'text/csv;charset=utf-8');
    }

    function destLabel(dest) {
        if (dest === 'spend') return t('destSpend');
        if (dest === 'debt') return t('destDebt');
        if (dest === 'savings') return t('destSavings');
        const g = state.goals.find(x => 'goal:' + x.id === dest);
        return g ? t('destGoal', { name: g.name }) : t('destSavings');
    }

    // ================= PIN =================
    async function hashPin(pin, salt) {
        const text = salt + ':' + pin;
        try {
            if (window.crypto && crypto.subtle) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            }
        } catch (e) { /* fall through */ }
        let h = 2166136261; for (let k = 0; k < text.length; k++) { h ^= text.charCodeAt(k); h = Math.imul(h, 16777619); }
        return 'f' + (h >>> 0).toString(16);
    }

    // ================= Persistence & account sync =================
    const sync = { db: null, ref: null, on: false, lastBody: null, writing: null, pending: false, timer: null, unsub: null };
    const LOCAL_ONLY = ['tab'];

    function bodyOf(s) {
        const copy = { ...s }; LOCAL_ONLY.forEach(k => delete copy[k]); delete copy.updatedAt;
        return JSON.stringify(copy);
    }

    function persist() {
        const body = bodyOf(state);
        const changed = body !== sync.lastBody;
        if (changed) { if (sync.lastBody !== null) state.updatedAt = Date.now(); sync.lastBody = body; }
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ }
        if (changed && sync.on) scheduleRemote();
    }

    function scheduleRemote() {
        clearTimeout(sync.timer);
        sync.timer = setTimeout(pushRemote, 1200);
    }
    async function pushRemote() {
        if (!sync.on) return;
        if (sync.writing) { sync.pending = true; return; }
        const payload = { json: JSON.stringify({ ...state, tab: undefined }), updatedAt: state.updatedAt || Date.now(), v: 1 };
        if (payload.json.length > 240000) { trimForSync(); payload.json = JSON.stringify({ ...state, tab: undefined }); }
        sync.writing = (sync.writer ? sync.writer(payload) : sync.ref.set(payload)).catch(e => {
            if (e && (e.code === 'revoked' || e.code === 'invalid_argument' || e.code === 'not_granted')) { sync.on = false; renderSyncStatus(); }
        }).finally(() => { sync.writing = null; if (sync.pending) { sync.pending = false; pushRemote(); } });
    }
    function trimForSync() {
        // Keep the account copy under the document size cap: drop the oldest detail first.
        state.items.forEach(i => { if (i.history && i.history.length > 60) i.history = i.history.slice(-60); });
        state.goals.forEach(g => { if (g.history.length > 120) g.history = g.history.slice(-120); });
        state.expenses.sort((a, b) => a.ts - b.ts);
        while (JSON.stringify(state).length > 230000 && state.expenses.length > 50) state.expenses.shift();
    }

    function applyRemote(json) {
        try {
            const data = JSON.parse(json);
            if (!data || !Array.isArray(data.items)) return false;
            const tab = state.tab;
            state = migrate(data);
            state.tab = tab;
            sync.lastBody = bodyOf(state);
            resetCharts();
            return true;
        } catch (e) { return false; }
    }

    async function initSync() {
        if (!window.claude || typeof window.claude.use !== 'function') { renderSyncStatus(); return; }
        try {
            const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
            const id = user ? await user.id() : null;
            if (!db || !id) { renderSyncStatus(); return; }
            sync.db = db; sync.ref = db.doc('data/users/' + id + '/app');
            const snap = await sync.ref.get();
            const remote = snap.exists ? snap.data() : null;
            sync.on = true;
            if (remote && typeof remote.json === 'string' && (+remote.updatedAt || 0) > (state.updatedAt || 0)) {
                if (applyRemote(remote.json)) { render(); maybeLock(); }
            } else if (state.items.length || state.income || state.expenses.length || state.goals.length) {
                pushRemote();
            }
            sync.unsub = sync.ref.onSnapshot(s => {
                if (!s.exists || s.metadata.hasPendingWrites) return;
                const r = s.data();
                if (r && typeof r.json === 'string' && (+r.updatedAt || 0) > (state.updatedAt || 0)) {
                    if (applyRemote(r.json)) { render(); toast(t('syncUpdated')); }
                }
            }, () => { sync.on = false; renderSyncStatus(); });
            renderSyncStatus();
        } catch (e) { sync.on = false; renderSyncStatus(); }
    }

    function toast(msg) {
        const el = $('toast');
        el.textContent = msg; el.classList.add('show');

    const raf = cb => (window.requestAnimationFrame ? window.requestAnimationFrame(cb) : setTimeout(cb, 16));

    // Animated number: counts from the previous value to the new one.
    function countTo(el, to, f) {
        const from = typeof el._v === 'number' ? el._v : 0;
        el._v = to;
        if (reduceMotion() || from === to || !window.requestAnimationFrame) { el.textContent = f(to); return; }
        cancelAnimationFrame(el._raf);
        const start = performance.now(), dur = 750;
        const step = now => {
            const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
            el.textContent = f(from + (to - from) * e);
            if (p < 1) el._raf = requestAnimationFrame(step);
        };
        el._raf = requestAnimationFrame(step);
    }
    function setRing(el, pct, color) {
        el.setAttribute('stroke-dashoffset', String(100 - Math.max(0, Math.min(100, pct))));
        el.style.stroke = color;
    }
    function setBar(el, pct, color) {
        el.style.width = Math.max(0, Math.min(100, pct)) + '%';

    }
    // Bars inside re-rendered HTML: start from their last width so they only animate on change.
    function animBars(root) {
        root.querySelectorAll('[data-w]').forEach(el => {
            const key = el.dataset.key, w = +el.dataset.w;
            el.style.width = (barMem[key] ?? 0) + '%';
            barMem[key] = w;
        });
        raf(() => raf(() => root.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; })));
    }

        if (i.paid) return { k: 'paid', diff: 0 };

        if (diff < 0) return { k: 'overdue', diff };
        if (diff === 0) return { k: 'today', diff };
        if (diff <= 3) return { k: 'soon', diff };
