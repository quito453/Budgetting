        $('upcoming-list').innerHTML = upcoming.length ? upcoming.map(i => obRow(i, 'compact')).join('')
            : state.items.length ? emptyHTML('party-popper', t('emptyAllPaidTitle'), t('upcomingEmpty'))
            : emptyHTML('calendar-clock', t('emptyBillsTitle'), t('emptySchedule'), t('addObligation'), 'openEntryModal()');
        $('tip-today').innerHTML = ccTip() + agentHTML(c);
        renderQuickSpend();
        $('ant-insight').innerHTML = antInsight(c);
    }

    // ================= PAYMENTS =================
    function renderPayments(c) {
        const now = new Date(), y = now.getFullYear(), m = now.getMonth(), dim = daysInMonth(now), today = now.getDate();
        if (!selectedDay || selectedDay > dim) selectedDay = today;
        $('cal-title').textContent = cap(now.toLocaleDateString(LOCALES[state.lang], { month: 'long', year: 'numeric' }));

        const wds = Array.from({ length: 7 }, (_, k) => new Date(2023, 0, 1 + k).toLocaleDateString(LOCALES[state.lang], { weekday: 'short' }).replace('.', '').slice(0, 3));
        const offset = new Date(y, m, 1).getDay();
        const spentBy = {};
        c.monthExp.forEach(e => { const d = new Date(e.ts).getDate(); spentBy[d] = (spentBy[d] || 0) + e.amount; });
        let html = wds.map(w => `<div class="wd">${esc(w)}</div>`).join('');
        for (let k = 0; k < offset; k++) html += '<div class="day empty"></div>';
        for (let d = 1; d <= dim; d++) {
            const due = state.items.filter(i => dueDay(i) === d && dueInMonth(i, y, m));
            const dots = due.slice(0, 4).map(i => {
                const s = itemStatus(i).k;
                return `<i class="dot ${s === 'paid' ? 'paid' : s === 'overdue' ? 'overdue' : (s === 'today' || s === 'soon') ? 'soon' : 'up'}"></i>`;
            }).join('');
            const cls = ['day', d === today ? 'today' : '', d < today ? 'past' : '', d === selectedDay ? 'sel' : ''].join(' ');
            html += `<button class="${cls}" onclick="selectDay(${d})"><span class="n num">${d}</span><span class="dots">${dots}</span>${spentBy[d] ? `<span class="sp num">${esc(fmtCompact(spentBy[d]))}</span>` : ''}</button>`;
        }
        $('cal-grid').innerHTML = html;

        const sel = new Date(y, m, selectedDay);
        const dueSel = state.items.filter(i => dueDay(i) === selectedDay && dueInMonth(i, y, m));
        const expSel = c.monthExp.filter(e => new Date(e.ts).getDate() === selectedDay).sort((a, b) => b.ts - a.ts);
        let day = `<p class="serif" style="font-size:19px">${esc(cap(sel.toLocaleDateString(LOCALES[state.lang], { weekday: 'long', day: 'numeric', month: 'long' })))}</p>`;
        if (!dueSel.length && !expSel.length) day += `<p class="muted small mt-2">${esc(t('dayEmpty'))}</p>`;
        if (dueSel.length) day += `<p class="eyebrow mt-3 mb-2">${esc(t('dayDue'))}</p>` + dueSel.map(i => obRow(i, 'compact')).join('');
        if (expSel.length) day += `<p class="eyebrow mt-4 mb-2">${esc(t('dayExpenses'))}</p>` + expSel.map(e => {
            const cat = catOf(e.cat);
            return `<div class="list-row"><span class="emoji-badge">${cat.emoji}</span><span class="grow truncate">${esc(e.note || t('cat_' + cat.id))}</span><b class="num">${fmt(e.amount)}</b></div>`;
        }).join('');
        $('cal-day').innerHTML = day;

        const unpaid = state.items.filter(i => !i.paid).sort((a, b) => dueDiff(a) - dueDiff(b));
        const paid = state.items.filter(i => i.paid).sort((a, b) => dueDay(a) - dueDay(b));
        $('ledger-list').innerHTML = state.items.length
            ? (unpaid.map(i => obRow(i)).join('') || `<p class="muted">${esc(t('upcomingEmpty'))}</p>`)
            : emptyHTML('calendar-clock', t('emptyBillsTitle'), t('emptySchedule'), t('addObligation'), 'openEntryModal()');
        $('completed-wrap').classList.toggle('hidden', !paid.length);
        $('completed-list').innerHTML = paid.map(i => obRow(i)).join('');
        animBars($('ledger-list')); animBars($('completed-list'));
    }

    // ================= DEBTS =================
    function renderDebts(c, P) {
        const all = state.items.filter(i => i.type === 'debt');
        const active = all.filter(i => !i.completed);
        const owed = (P ? P.debts.reduce((a, d) => a + d.bal, 0) : 0);
        const tracked = all.filter(i => i.startBalance > 0);
        const startSum = tracked.reduce((a, i) => a + i.startBalance, 0);
        const paidSum = tracked.reduce((a, i) => a + Math.max(0, i.startBalance - i.balance), 0);
        const pct = startSum > 0 ? (paidSum / startSum) * 100 : 0;

        countTo($('debt-total'), owed, v => fmt(v, 0));
        $('debt-paid-line').textContent = startSum > 0 ? `${t('debtPaidSoFar', { paid: fmt(paidSum, 0), total: fmt(startSum, 0) })} · ${Math.round(pct)}%` : '';
        setBar($('debt-bar'), pct);
        $('debt-free').innerHTML = !active.length ? `<span class="accent">${esc(t('agentClear'))}</span>`
            : P && !P.plan.stuck ? `🏁 <span style="text-transform:none">${esc(t('debtFreeBy', { date: monthLabel(P.plan.months, 'long') }))}</span>`
            : `<span class="warn">${esc(t('debtFreeNever'))}</span>`;

        $('surplus-title').textContent = t('surplusTitle', { pct: c.plan.s });
        countTo($('surplus-val'), c.surplusLeft, v => fmt(v, 0));
        $('surplus-sub').textContent = t('surplusSub', { total: fmt(c.surplus, 0), used: fmt(c.extraPaid, 0) });
        $('tip-debts').innerHTML = agentHTML(c);

        // Debt cards with milestones
        $('debt-cards').innerHTML = all.length ? all.map(i => {
            const p = itemProgress(i) ?? 0;
            const paidAmt = Math.max(0, i.startBalance - i.balance);
            const next = MILESTONES.find(m => m > p);
            let hint;
            if (i.completed) hint = `<span class="accent" style="font-weight:700">🏆 ${esc(t('paidOff'))}</span>`;
            else if (!next) hint = `<span class="accent" style="font-weight:600">${esc(t('lastStretch'))}</span>`;
            else if (i.startBalance > 0) hint = esc(t('nextMilestone', { m: next, x: fmt(i.startBalance * next / 100 - paidAmt, 0) }));
            else hint = esc(t('nextMilestone', { m: next, x: '' })).replace(/ · .*$/, '');
            const marks = MILESTONES.map(m => `<i class="ms ${p >= m ? 'hit' : ''}" style="left:${m}%"></i>`).join('');
            const labels = MILESTONES.map(m => `<span class="${p >= m ? 'hit' : ''}" style="left:${m}%">${m}%</span>`).join('');
            const amountLine = i.startBalance > 0 ? t('progressPaid', { paid: fmt(paidAmt, 0), total: fmt(i.startBalance, 0) })
                : (i.subtype === 'loan' && i.totalMonths) ? t('monthOf', { n: i.monthsPaid, total: i.totalMonths }) : '';
            return `<div class="debt-card">
                <div class="between" style="align-items:flex-start">
                    <div class="grow">
                        <p class="truncate" style="font-weight:700; font-size:16px">${esc(i.name)}</p>
                        <div class="row wrap mt-1" style="gap:6px"><span class="pill">${esc(typeLabel(i))}</span>${i.apr ? `<span class="pill">${i.apr}%</span>` : ''}</div>
                    </div>
                    <button class="icon-btn sm" onclick="openEditModal('${i.id}')" title="${esc(t('editBtn'))}" aria-label="${esc(t('editBtn'))}">${EDIT_ICON}</button>
                </div>
                <div class="between" style="align-items:flex-end">
                    <p class="serif num" style="font-size:28px; line-height:1">${fmt(i.balance || (i.subtype === 'loan' ? i.amount * Math.max(0, i.totalMonths - i.monthsPaid) : 0), 0)}</p>
                    <p class="serif num accent" style="font-size:20px">${Math.round(p)}%</p>
                </div>
                <div>
                    <div class="ms-bar"><span data-key="dc-${i.id}" data-w="${p}"></span>${marks}</div>
                    <div class="ms-labels mt-1">${labels}</div>
                </div>
                <p class="tiny muted">${esc(amountLine)}</p>
                <p class="small">${hint}</p>
                ${i.stmt ? `<button class="btn btn-ghost btn-sm" onclick="openCardInsight('${i.id}')">💡 ${esc(t('ccUnderstand'))}</button>` : ''}
                <div class="between mt-1">
                    <span class="tiny muted">${i.completed ? '' : esc(i.paid ? t('paidThisMonth') : t('nextPayment', { d: dueDay(i), x: fmt(i.amount, 0) }))}</span>
                    ${!i.paid && !i.completed ? `<button class="btn btn-primary btn-sm" onclick="openPaymentModal('${i.id}')">${esc(t('payBtn'))}</button>` : ''}
                </div>
            </div>`;
        }).join('') : `<div style="grid-column:1/-1">${emptyHTML('trending-down', t('emptyDebtTitle'), t('emptyDebtText'), t('ccAdd'), 'openCardModal()')}</div>`;
        animBars($('debt-cards'));

        renderPlan(c, P);
        renderConsolidation();
        renderTrophies();
    }

    function renderPlan(c, P) {
        $('plan-empty').classList.toggle('hidden', !!P);
        $('plan-body').classList.toggle('hidden', !P);
        if (!P) return;
        const { debts, extra, plan, base } = P;
        const extraEl = $('p-extra');
        if (document.activeElement !== extraEl) extraEl.value = extra;
        $('p-extra-hint').innerHTML = `${esc(t('planExtraHint', { x: fmt(c.surplus, 0) }))}${state.planExtra !== null ? ` <button onclick="setPlanExtra(null)" class="btn-link tiny">${esc(t('planUseSurplus'))}</button>` : ''}`;
        $('m-avalanche').classList.toggle('active', state.planMethod === 'avalanche');
        $('m-snowball').classList.toggle('active', state.planMethod === 'snowball');
        $('p-method-hint').textContent = t(state.planMethod === 'avalanche' ? 'avalancheHint' : 'snowballHint');

        $('p-date').textContent = plan.stuck ? t('planNever') : cap(monthLabel(plan.months, 'long'));
        $('p-months').textContent = plan.stuck ? t('planNeverSub') : t('planMonths', { n: plan.months });
        $('p-interest').textContent = fmt(plan.interest, 0);
        $('p-interest-base').textContent = base.stuck ? '' : t('planBaseInterest', { x: fmt(base.interest, 0) });
        if (base.stuck && !plan.stuck) { $('p-saved').textContent = '∞'; $('p-saved-months').textContent = t('planNeverSub'); }
        else if (plan.stuck) { $('p-saved').textContent = '—'; $('p-saved-months').textContent = ''; }
        else {
            $('p-saved').textContent = fmt(Math.max(0, base.interest - plan.interest), 0);
            const sooner = base.months - plan.months;
            $('p-saved-months').textContent = sooner > 0 ? t('planSavedMonths', { n: sooner }) : t('planSameTime');
        }
        const stuckNames = debts.filter(d => d.min <= d.bal * d.apr / 1200 + 0.005).map(d => d.name);
        $('p-warn').classList.toggle('hidden', !stuckNames.length);
        $('p-warn').textContent = stuckNames.length ? t('planStuck', { names: stuckNames.join(', ') }) : '';

        const order = [...plan.debts].sort((a, b) => (a.paidMonth ?? 1e9) - (b.paidMonth ?? 1e9));
        $('p-order').innerHTML = order.map((d, idx) => `
            <div class="list-row">
                <span class="emoji-badge num" style="font-size:14px; font-weight:700; color:var(--accent)">${idx + 1}</span>
                <div class="grow"><p class="truncate" style="font-weight:600">${esc(d.name)}</p><p class="tiny muted">${fmt(d.bal, 0)}${d.apr ? ` · ${d.apr}%` : ''}${d.approx ? ` · ${esc(t('planApprox'))}` : ''}</p></div>
                <span class="pill ${d.paidMonth ? 'ok' : 'danger'}" title="${d.paidMonth ? esc(t('planPaidOn', { date: monthLabel(d.paidMonth) })) : ''}">${d.paidMonth ? '🏁 ' + esc(monthLabel(d.paidMonth)) : esc(t('planNever'))}</span>
            </div>`).join('');

        if (!window.Chart || state.tab !== 'debts') return;
        const len = Math.min(MAX_MONTHS, Math.max(plan.months, Math.min(base.months, Math.max(plan.months * 3, 24))));
        const step = Math.max(1, Math.ceil(len / 60));
        const idxs = []; for (let k = 0; k <= len; k += step) idxs.push(k); if (idxs[idxs.length - 1] !== len) idxs.push(len);
        const pick = s => idxs.map(k => Math.round(s[k] ?? 0));
        const labels = idxs.map(k => k === 0 ? t('today') : monthLabel(k));
        const accent = cssVar('--accent'), faint = cssVar('--faint'), grid = cssVar('--grid'), muted = cssVar('--muted');
        const datasets = [
            { label: t('chartPlan'), data: pick(plan.series), borderColor: accent, backgroundColor: accent + '22', fill: true, tension: .3, pointRadius: 0, borderWidth: 2.5 },
            { label: t('chartBase'), data: pick(base.series), borderColor: faint, borderDash: [5, 5], fill: false, tension: .3, pointRadius: 0, borderWidth: 1.5 }
        ];
        if (!planChart) {
            planChart = new Chart($('planChart'), {
                type: 'line', data: { labels, datasets },
                options: {
                    maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    animation: { duration: reduceMotion() ? 0 : 900 },
                    plugins: { legend: { labels: { color: muted, boxWidth: 12, usePointStyle: true, font: { family: 'DM Sans', size: 12 } } }, tooltip: { callbacks: { label: x => ` ${x.dataset.label}: ${fmt(x.parsed.y, 0)}` } } },
                    scales: {
                        x: { ticks: { color: muted, maxTicksLimit: 6, font: { family: 'DM Sans', size: 11 } }, grid: { display: false }, border: { display: false } },
                        y: { beginAtZero: true, ticks: { color: muted, maxTicksLimit: 5, font: { family: 'DM Sans', size: 11 }, callback: v => fmtCompact(v) }, grid: { color: grid }, border: { display: false } }
                    }
                }
            });
        } else { planChart.data.labels = labels; planChart.data.datasets = datasets; planChart.update(); }
    }

    function renderConsolidation() {
        const debts = activeDebts();
        $('cons-empty').classList.toggle('hidden', !!debts.length);
        $('cons-body').classList.toggle('hidden', !debts.length);
        if (!debts.length) return;
        $('k-debts').innerHTML = debts.map(d => {
            const on = !state.consExcluded.includes(d.id);
            return `<button onclick="toggleConsDebt('${d.id}')" class="toggle-chip ${on ? 'on' : ''}">${on ? '✓ ' : ''}${esc(d.name)} <span style="font-weight:400; opacity:.75">${fmt(d.bal, 0)}${d.apr ? ' · ' + d.apr + '%' : ''}</span></button>`;
        }).join('');
        const sel = selectedDebts();
        if (!sel.length) { $('k-current').textContent = t('consNone'); $('k-offers').innerHTML = ''; return; }
        const baseline = simulate(sel, 0, 'avalanche', true);
        const bal = sel.reduce((a, d) => a + d.bal, 0), pay = sel.reduce((a, d) => a + d.min, 0);
        $('k-current').textContent = baseline.stuck
            ? t('consCurrentNever', { bal: fmt(bal, 0), pay: fmt(pay, 0) })
            : t('consCurrent', { bal: fmt(bal, 0), pay: fmt(pay, 0), months: baseline.months, total: fmt(baseline.paid, 0) });

        const results = state.offers.map(o => ({ o, x: evalOffer(o, sel) }));
        const bestId = results.length > 1 ? [...results].sort((a, b) => a.x.total - b.x.total)[0].o.id : null;
        $('k-offers').innerHTML = results.map(({ o, x }) => {
            const payDrop = fmt(Math.abs(x.payDiff), 0);
            let verdict, tone;
            if (x.save === Infinity) { verdict = t('vGoodNever'); tone = 'ok'; }
            else if (x.save > 0 && x.payDiff <= 0) { verdict = t('vGood', { save: fmt(x.save, 0), pay: payDrop }); tone = 'ok'; }
            else if (x.save > 0) { verdict = t('vGoodHigher', { save: fmt(x.save, 0), pay: payDrop }); tone = 'ok'; }
            else if (x.payDiff < 0) { verdict = t('vTrap', { pay: payDrop, cost: fmt(-x.save, 0) }); tone = 'warn'; }
            else { verdict = t('vBad', { cost: fmt(-x.save, 0) }); tone = 'danger'; }
            return `<div class="offer ${o.id === bestId ? 'best' : ''}">
                <div class="between" style="align-items:flex-start">
                    <div class="grow">
                        ${o.id === bestId ? `<span class="pill ok mb-2">★ ${esc(t('consBest'))}</span>` : ''}
                        <p class="truncate" style="font-weight:700; font-size:16px">${esc(o.name)}</p>
                        <p class="tiny muted">${o.rate}% · ${esc(t('consMonths', { n: o.term }))}${o.feePct ? ` · ${o.feePct}%` : ''}${o.insurance ? ` · +${fmt(o.insurance, 0)}` : ''}</p>
                    </div>
                    <button class="icon-btn sm del" onclick="removeOffer('${o.id}')" title="${esc(t('consRemove'))}" aria-label="${esc(t('consRemove'))}">${X_ICON}</button>
                </div>
                <div class="kv"><span class="muted">${esc(t('consPayment'))}</span><b class="num">${fmt(x.monthly)} <span class="tiny ${x.payDiff < 0 ? 'accent' : x.payDiff > 0 ? 'warn' : 'muted'}">${x.payDiff > 0 ? '+' : x.payDiff < 0 ? '−' : ''}${payDrop}</span></b></div>
                <div class="kv"><span class="muted">${esc(t('consTotal'))}</span><b class="num">${fmt(x.total, 0)}</b></div>
                <div class="kv"><span class="muted">${esc(t('consEff'))}</span><b class="num">${x.eff.toFixed(1)}%</b></div>
                <div class="note ${tone} small">${esc(verdict)}<span class="tiny" style="display:block; opacity:.75; margin-top:4px">${esc(t('consVs', { pay: fmt(x.comparePay, 0) }))}</span></div>
                <button class="btn btn-ghost btn-sm mt-1" onclick="applyOffer('${o.id}')">${esc(t('consApply'))}</button>
            </div>`;
        }).join('');
    }

    function renderTrophies() {
        const current = state.items.filter(i => i.type === 'debt' && i.completed).map(i => ({ ...archiveEntry(i, state.period), thisMonth: true }));
        const list = [...current, ...[...state.archive].reverse()];
        $('trophies').innerHTML = list.length ? `<div class="trophies">${list.map(a => `
            <div class="trophy">
                <div class="cup">🏆</div>
                <p class="truncate" style="font-weight:700">${esc(a.name)}</p>
                <p class="serif num mt-1" style="font-size:20px">${fmt(a.total, 0)}</p>
                <p class="tiny muted mt-1">${esc(a.thisMonth ? t('trophyThisMonth') : t('trophyPaidOn', { date: periodLabel(a.period) }))}</p>
            </div>`).join('')}</div>` : `<div class="note plain">${esc(t('trophiesEmpty'))}</div>`;
    }

    // ================= SUMMARY =================
    function renderSummary(c) {
        countTo($('sum-income'), c.income, v => fmt(v, 0));
        countTo($('sum-fixed'), c.fixed, v => fmt(v, 0));
        countTo($('sum-spent'), c.spent, v => fmt(v, 0));
        countTo($('sum-saving'), c.savings, v => fmt(v, 0));

        // Health
        const lines = $('health-lines'), scoreEl = $('health-score'), ring = $('health-ring');
        if (!c.income) {
            scoreEl.textContent = '—'; $('health-label').textContent = ''; setRing(ring, 0, cssVar('--faint'));
            lines.innerHTML = `<p class="muted">${esc(t('healthNoIncome'))}</p>`;
        } else {
            const fPct = (c.fixed / c.income) * 100, sPct = ((c.savings + c.surplus) / c.income) * 100;
            let score = 100 - (Math.max(0, fPct - 50) * 1.5) - (Math.max(0, 20 - sPct) * 2);
            if (c.bufferLeft < 0) score -= 10;
            const final = Math.max(0, Math.min(100, Math.round(score)));
            const tone = final >= 70 ? 'accent' : final >= 40 ? 'warn' : 'danger';
            setRing(ring, final, tone === 'accent' ? 'url(#brandGrad)' : cssVar('--' + tone));
            countTo(scoreEl, final, v => String(Math.round(v)));
            $('health-label').textContent = t(final >= 70 ? 'healthGood' : final >= 40 ? 'healthOk' : 'healthBad');
            $('health-label').style.color = `var(--${tone})`;
            const ok = (good, text) => `<p class="row" style="align-items:flex-start; gap:8px"><span>${good ? '✅' : '⚠️'}</span><span>${esc(text)}</span></p>`;
            lines.innerHTML = ok(fPct < 50, t('healthFixed', { x: Math.round(fPct) })) + ok(sPct >= 20, t('healthSave', { x: Math.round(sPct) })) +
                (c.bufferLeft < 0 ? ok(false, t('healthOverLine')) : '');
        }

        // Categories
        const totals = {};
        c.monthExp.forEach(e => { totals[e.cat] = (totals[e.cat] || 0) + e.amount; });
        Object.keys(state.catLimits).forEach(k => { if (!(k in totals)) totals[k] = 0; });
        const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
        const lastP = (() => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1); return periodKey(d); })();
        const lastTotal = state.expenses.filter(e => e.period === lastP).reduce((a, e) => a + e.amount, 0);
        $('cat-bars').innerHTML = rows.length ? rows.map(([id, v]) => {
            const cat = catOf(id), lim = state.catLimits[id];
            const share = c.spent ? (v / c.spent) * 100 : 0;
            const pct = lim ? Math.min(100, v / lim * 100) : share;
            const color = lim ? (v > lim ? 'var(--danger)' : v / lim >= .8 ? 'var(--warn)' : 'var(--accent)') : 'var(--c-buffer)';
            const right = lim ? `<span class="tiny ${v > lim ? 'danger' : 'muted'}">${esc(t('limitOf', { spent: fmt(v, 0), limit: fmt(lim, 0) }))}</span>`
                : `<span class="muted tiny">${Math.round(share)}%</span> &nbsp;<b>${fmt(v, 0)}</b>`;
            return `<div class="cat-row">
                <div class="between small mb-2"><span class="row" style="gap:8px"><span style="font-size:18px">${cat.emoji}</span><b>${esc(t('cat_' + id))}</b></span><span class="num">${right}</span></div>
                <div class="bar"><span data-key="cat-${id}" data-w="${pct}" style="background:${color}"></span></div>
            </div>`;
        }).join('') + `<div class="divider"></div><div class="between tiny muted wrap"><span>${esc(t('catOfBudget', { spent: fmt(c.spent, 0), budget: fmt(c.buffer, 0) }))}</span>${lastTotal ? `<span>${esc(t('catVsLast', { x: fmt(lastTotal, 0) }))}</span>` : ''}</div>`
            : `<p class="muted">${esc(t('catEmpty'))}</p>`;
        animBars($('cat-bars'));

        // Allocation donut
        const data = [c.fixed, c.buffer, c.surplus, c.savings];
        const labels = [t('legendBills'), t('legendBuffer', { pct: c.plan.b }), t('legendSurplus'), t('legendSavings')];
        const colors = ['--c-bills', '--c-buffer', '--c-surplus', '--c-savings'].map(cssVar);
        countTo($('donut-total'), c.income, v => fmt(v, 0));
        const total = data.reduce((a, b) => a + b, 0) || 1;
        $('legend').innerHTML = labels.map((l, i) => `
            <div class="between small">
                <span class="row" style="gap:10px"><i style="width:12px; height:12px; border-radius:4px; background:${colors[i]}; display:inline-block"></i>${esc(l)}</span>
                <span class="num"><span class="muted tiny">${Math.round(data[i] / total * 100)}%</span> &nbsp;<b>${fmt(data[i], 0)}</b></span>
            </div>`).join('');
        if (!window.Chart || state.tab !== 'summary') return;
        if (!donutChart) {
            donutChart = new Chart($('donutChart'), {
                type: 'doughnut',

    // ================= Confetti =================
    function confetti(big = true) {
        if (reduceMotion()) return;
        const cv = $('confetti'), ctx = cv.getContext && cv.getContext('2d');
        if (!ctx) return;
        const dpr = window.devicePixelRatio || 1, W = window.innerWidth, H = window.innerHeight;
        cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const colors = ['--accent', '--warn', '--info', '--c-bills', '--c-savings'].map(cssVar);
        const n = big ? 160 : 60, parts = [];
        for (let k = 0; k < n; k++) {
            const fromLeft = k % 2 === 0;
            parts.push({
                x: fromLeft ? -10 : W + 10, y: H * (big ? .75 : .6),
                vx: (fromLeft ? 1 : -1) * (4 + Math.random() * (big ? 9 : 6)), vy: -(8 + Math.random() * (big ? 12 : 8)),
                w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
                c: colors[k % colors.length], life: 0
            });
        }
        const start = performance.now();
        cancelAnimationFrame(confetti._raf);
        const tick = now => {
            ctx.clearRect(0, 0, W, H);
            parts.forEach(p => {
                p.vy += .32; p.vx *= .985; p.vy *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
            });
            if (now - start < 3200) confetti._raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
        };
        confetti._raf = requestAnimationFrame(tick);
    }

        const totalRaw = parseFloat(v('e-total'));
        const total = type === 'debt' ? (totalRaw > 0 ? totalRaw : balance) : 0;

        const errors = [];
        const mark = (id, bad, msg) => { $(id).classList.toggle('invalid', bad); if (bad) errors.push(t(msg)); };
        mark('e-name', !name, 'errName');
        mark('e-date', !(date >= 1 && date <= 31), 'errDate');
        mark('e-amount', !(amount > 0), 'errAmount');
        mark('e-months', subtype === 'loan' && !(months >= 1), 'errMonths');
        mark('e-total', type === 'debt' && totalRaw > 0 && totalRaw < balance, 'errTotal');
        if (errors.length) { $('entry-error').textContent = errors.join(' '); $('entry-error').classList.remove('hidden'); return; }

        const fields = { type, subtype, name, amount: round2(amount), date, balance: round2(balance), startBalance: round2(total),
                         apr: type === 'debt' ? Math.max(0, parseFloat(v('e-apr')) || 0) : 0 };
        if (editingId) {
            const item = state.items.find(i => i.id === editingId);
            if (item) {
                Object.assign(item, fields);
                if (subtype === 'loan') item.totalMonths = (item.monthsPaid || 0) + months;
                else { item.totalMonths = 0; item.monthsPaid = 0; }
                const loanLeft = subtype === 'loan' && item.monthsPaid < item.totalMonths;
                if (type !== 'debt') item.completed = false;
                else if (item.completed && (balance > 0 || loanLeft)) item.completed = false;
                if (item.lastPay) item.lastPay.balance = Math.max(item.lastPay.balance, balance);
            }
        } else {
            state.items.push({ id: uid(), ...fields, totalMonths: subtype === 'loan' ? months : 0,

    function confirmTransaction() {
        const item = state.items.find(i => i.id === activePaymentId);
        let celebrate = null;
        if (item && !item.paid && item.stmt) {
            const r = confirmStmtPayment(item);
            if (r && r.abort) { $('pay-cc-amount').classList.add('invalid'); return; }
            activePaymentId = null;
            closeModal('payment-modal'); render();
            if (r && r.short) toast('⚠️ ' + t('ccShortToast', { x: fmt(r.short) }));
            else if (r) cheer('celebrando', r.msg, true);
            return;
        }
        if (item && !item.paid) {
            const extra = item.type === 'debt' ? Math.max(0, parseFloat($('pay-extra-amount').value) || 0) : 0;
            const before = itemProgress(item) ?? 0;
            item.lastPay = { balance: item.balance, monthsPaid: item.monthsPaid, extra };
            if (item.type === 'debt') {
                const hadBalance = item.balance > 0;
                item.balance = round2(Math.max(0, item.balance - (item.amount + extra)));
                item.extraPaid = (item.extraPaid || 0) + extra;
                if (item.subtype === 'loan') item.monthsPaid++;
                // Finished, but kept until next month so this month's numbers don't shift
                if ((item.subtype === 'loan' && item.monthsPaid >= item.totalMonths) || (hadBalance && item.balance === 0)) item.completed = true;
                const after = itemProgress(item) ?? 0;
                if (item.completed) celebrate = { big: true, msg: t('paidOffToast', { name: item.name }), m: 'se-logro' };
                else {
                    const hit = MILESTONES.filter(m => before < m && after >= m).pop();
                    if (hit) celebrate = { big: false, msg: t('milestoneToast', { m: hit, name: item.name }), m: hit >= 75 ? 'en-racha' : 'logro' };
                }
            }
            item.paid = true;
            item.history = item.history || [];
            item.history.push({ ts: Date.now(), amount: item.amount, extra });
        }
        activePaymentId = null;
        closeModal('payment-modal'); render();
        if (celebrate) cheer(celebrate.m, celebrate.msg, celebrate.big);
    }

    function undoPayment(id) {
        const item = state.items.find(i => i.id === id);
        if (!item || !item.paid) return;
        if (item.lastPay) {
            item.balance = item.lastPay.balance;
            item.monthsPaid = item.lastPay.monthsPaid;
            item.extraPaid = Math.max(0, (item.extraPaid || 0) - (item.lastPay.extra || 0));
            if (item.lastPay.stmt) item.stmt = item.lastPay.stmt;
        }
        if (item.history && item.history.length) item.history.pop();
        item.paid = false; item.completed = false; item.lastPay = null;
        render();
    }

    // ================= Calendar links (the viewer cannot save .ics files) =================
    function gcalLink(i) {
        const now = new Date();
        let first = new Date(now.getFullYear(), now.getMonth(), 1);
        if (i.paid || dueDay(i, first) < now.getDate()) first = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        first.setDate(dueDay(i, first));
        const end = new Date(first); end.setDate(end.getDate() + 1);
        let rr = 'RRULE:FREQ=MONTHLY;BYMONTHDAY=' + (i.date > 28 ? -1 : i.date);
        if (i.subtype === 'loan' && i.totalMonths) rr += ';COUNT=' + Math.max(1, i.totalMonths - i.monthsPaid);
        const p = new URLSearchParams({ action: 'TEMPLATE', text: t('icsPay', { name: i.name }) + ' (' + fmt(i.amount) + ')',
            dates: icsDate(first) + '/' + icsDate(end), details: t('icsDesc', { amount: fmt(i.amount) }), recur: rr });
        return 'https://calendar.google.com/calendar/render?' + p.toString();
    }

    function saveGoal() {
        const name = $('g-name').value.trim(), target = parseFloat($('g-target').value), saved = Math.max(0, parseFloat($('g-saved').value) || 0);
        const due = $('g-due').value || null;
        if (!name || !(target > 0)) { $('goal-error').textContent = t('goalErr'); $('goal-error').classList.remove('hidden'); return; }
        const g = goalEditId && state.goals.find(x => x.id === goalEditId);
        if (g) {
            Object.assign(g, { name, target: round2(target), emoji: goalEmoji, due: /^\d{4}-\d{2}$/.test(due || '') ? due : null });
            if (round2(saved) !== g.saved) goalAdd(g, round2(saved) - g.saved, { manual: true });
        } else {
            const ng = { id: uid(), name, emoji: goalEmoji, target: round2(target), saved: 0, due: /^\d{4}-\d{2}$/.test(due || '') ? due : null, kind: 'custom', history: [] };
            if (saved > 0) goalAdd(ng, saved, { manual: true });
            state.goals.push(ng);
        }
        closeModal('goal-modal'); render();

        state.goals = state.goals.filter(x => x.id !== g.id);

    // ================= Income & bonus actions =================
    function addIncome() {
        const amtEl = $('i-amount'), amount = parseFloat(amtEl.value);
        if (!(amount > 0)) { amtEl.classList.add('invalid'); amtEl.focus(); return; }
        amtEl.classList.remove('invalid');
        recordIncome(round2(amount), $('i-dest').value, $('i-note').value.trim().slice(0, 50));
        amtEl.value = ''; $('i-note').value = '';
        render(); toast('💵 ' + t('incomeAdded'));
    }
    function recordIncome(amount, dest, note, bonus = null) {
        const x = { id: uid(), amount, note, ts: Date.now(), period: state.period, dest, bonus };
        state.incomes.push(x);
        let hit = false;
        if (dest.startsWith('goal:')) {
            const g = state.goals.find(gg => 'goal:' + gg.id === dest);
            if (g) hit = goalAdd(g, amount, { incomeId: x.id }); else x.dest = 'savings';
        }
        if (hit) { const g = state.goals.find(gg => 'goal:' + gg.id === dest); setTimeout(() => cheer('logro', t('goalHitToast', { name: g.name }), true), 300); }
        return x;
    }
    function removeIncome(id) {
        const x = state.incomes.find(i => i.id === id);
        if (!x) return;
        if (x.dest.startsWith('goal:')) {
            const g = state.goals.find(gg => 'goal:' + gg.id === x.dest);
            const h = g && g.history.find(hh => hh.incomeId === x.id);
            if (g && h) { g.saved = round2(Math.max(0, g.saved - h.amount)); g.history = g.history.filter(hh => hh !== h); }
        }
        state.incomes = state.incomes.filter(i => i.id !== id);
        render(); toast(t('incomeDeleted'));
    }
    function focusBonusKind(k) { focusBonus = k; render(); }
    function setBonusAmount(v) { state.bonus[focusBonus] = (v === '' || !(+v > 0)) ? null : +v; render(); }
    function setSplit(which, v) {
        const sp = state.bonus.split;
        const n = clampInt(v, 0, 100, 0);
        if (which === 'debt') { sp.debt = n; sp.save = Math.min(sp.save, 100 - n); }
        else { sp.save = Math.min(n, 100 - sp.debt); }
        sp.fun = 100 - sp.debt - sp.save;
        render();
    }
    function registerBonus() {
        const k = focusBonus, amt = bonusAmount(k);
        if (!(amt > 0)) { openConfigModal(); return; }
        const sp = state.bonus.split, label = t(k);

            if (!(v > 0)) return;
            const d = dest || (ef && ef.saved < ef.target ? 'goal:' + ef.id : 'savings');
            recordIncome(round2(v), d, label, k);
        });
        render(); cheer('ahorrando', t('bonusRegistered', { bonus: label }));
    }

    function limitToast(cat, amount) {

        if (total > lim && before <= lim) { toast('⚠️ ' + t('limitOver', { cat: t('cat_' + cat) })); return true; }

    // ================= Transfer code (move data between the file and the synced app) =================
    function b64encode(str) { const bytes = new TextEncoder().encode(str); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
    function b64decode(b64) { const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
    function transferCode() { return 'AP1:' + b64encode(JSON.stringify({ ...state, tab: undefined })); }
    async function copyTransfer() {
        const code = transferCode(), box = $('transfer-box');
        try { await navigator.clipboard.writeText(code); toast(t('transferCopied')); box.classList.add('hidden'); $('transfer-apply').classList.add('hidden'); }
        catch (e) {
            box.value = code; box.classList.remove('hidden'); $('transfer-apply').classList.add('hidden');
            box.focus(); box.select(); toast(t('transferSelect'));
        }
    }
    function toggleTransferPaste() {
        const box = $('transfer-box');
        box.value = ''; box.placeholder = 'AP1:…';
        box.classList.remove('hidden'); $('transfer-apply').classList.remove('hidden'); box.focus();
    }
    async function applyTransfer() {
        const raw = $('transfer-box').value.trim().replace(/\s+/g, '');
        let data = null;
        try { if (raw.startsWith('AP1:')) data = JSON.parse(b64decode(raw.slice(4))); } catch (e) { data = null; }
        if (!data || !Array.isArray(data.items)) { toast(t('transferBad')); return; }
        if (!(await askConfirm(t('transferConfirm'), t('transferApply'), true))) return;
        const tab = state.tab;
        state = migrate(data); state.tab = tab; state.updatedAt = Date.now();
        sync.lastBody = null;
        $('transfer-box').value = ''; $('transfer-box').classList.add('hidden'); $('transfer-apply').classList.add('hidden');
        pin.unlocked = true;
        resetCharts(); render(); closeModal('config-modal'); toast(t('transferDone'));
        if (sync.on) pushRemote();
    }

    const pin = { buf: '', stage: null, first: '', unlocked: false, hiddenAt: 0 };
    function keypadHTML(kind) {
        const k = n => `<button onclick="pinKey('${kind}','${n}')">${n}</button>`;
        const left = kind === 'set' ? `<button class="ghost" id="pin-ok" onclick="pinKey('set','ok')">OK</button>` : '<span></span>';
        return [1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('') + left + k(0) + `<button class="ghost" onclick="pinKey('${kind}','del')" aria-label="⌫">⌫</button>`;
    }
    function drawDots(id, len, total) { $(id).innerHTML = Array.from({ length: total }, (_, i) => `<i class="${i < len ? 'on' : ''}"></i>`).join(''); }
    function startPinSetup() {
        pin.buf = ''; pin.stage = 'new'; pin.first = '';
        $('pin-title').textContent = t('pinNewTitle'); $('pin-desc').textContent = t('pinNewDesc'); $('pin-err').textContent = '';
        $('pin-pad-set').innerHTML = keypadHTML('set'); drawDots('pin-dots-set', 0, 4);
        openModal('pin-modal');
    }
    async function pinKey(kind, key) {
        if (key === 'del') pin.buf = pin.buf.slice(0, -1);
        else if (key !== 'ok' && pin.buf.length < 6) pin.buf += key;
        if (kind === 'lock') {
            drawDots('pin-dots-lock', pin.buf.length, state.pinLen || 4);
            if (pin.buf.length === (state.pinLen || 4)) {
                const h = await hashPin(pin.buf, state.pinSalt || '');
                if (h === state.pinHash) { pin.unlocked = true; pin.buf = ''; $('lock').classList.remove('open'); $('lock-err').textContent = ''; render(); }
                else { pin.buf = ''; $('lock-err').textContent = t('lockWrong'); shake('pin-dots-lock'); setTimeout(() => drawDots('pin-dots-lock', 0, state.pinLen || 4), 400); }
            }
            return;
        }
        // setup
        const target = pin.stage === 'confirm' ? pin.first.length : 6;
        drawDots('pin-dots-set', pin.buf.length, pin.stage === 'confirm' ? pin.first.length : Math.max(4, pin.buf.length));
        const done = pin.stage === 'confirm' ? pin.buf.length === target : (key === 'ok' || pin.buf.length === 6) && pin.buf.length >= 4;
        if (!done) return;
        if (pin.stage === 'new') {
            pin.first = pin.buf; pin.buf = ''; pin.stage = 'confirm';
            $('pin-title').textContent = t('pinConfirmTitle'); $('pin-err').textContent = '';
            $('pin-ok').style.visibility = 'hidden';
            drawDots('pin-dots-set', 0, pin.first.length);
        } else if (pin.buf === pin.first) {
            state.pinSalt = uid(); state.pinLen = pin.first.length;
            state.pinHash = await hashPin(pin.first, state.pinSalt);
            pin.unlocked = true; pin.buf = ''; pin.first = '';
            closeModal('pin-modal'); render(); renderProfileExtras(); toast(t('pinSaved'));
        } else {
            pin.buf = ''; pin.first = ''; pin.stage = 'new';
            $('pin-title').textContent = t('pinNewTitle'); $('pin-err').textContent = t('pinMismatch');
            $('pin-ok').style.visibility = '';
            shake('pin-dots-set'); drawDots('pin-dots-set', 0, 4);
        }
    }
    function shake(id) { const el = $(id); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    function removePin() { state.pinHash = null; state.pinSalt = null; state.pinLen = 0; render(); renderProfileExtras(); toast(t('pinRemoved')); }
    function maybeLock(force) {
        if (window.APP_CONFIG) { $('lock').classList.remove('open'); return; } // web version uses the account PIN instead
        if (!state.pinHash) { $('lock').classList.remove('open'); return; }
        if (pin.unlocked && !force) return;
        pin.unlocked = false; pin.buf = '';
        document.querySelectorAll('.modal.open').forEach(m => m.classList.remove('open'));
        $('pin-pad-lock').innerHTML = keypadHTML('lock'); drawDots('pin-dots-lock', 0, state.pinLen || 4);
        $('lock-err').textContent = '';
        $('lock').classList.add('open');
    }

        ccPaidFullToast: 'Paid in full! Zero interest this period 🎉', ccShortToast: 'Payment recorded, but {x} is still missing to cover the minimum.',
        ccEstimated: 'Estimated: update with your new statement', ccUpdate: 'Update', ccUnderstand: 'Understand my card',
        ccTipSoon: '💳 Your {name} card is due in {n} days. If you pay only the minimum, you will pay about {int} in interest next month.',
        ccTipLate: '🚨 Your {name} card is past its due date. Pay at least the minimum ({min}) today to limit late charges.',
        yearsMonths: '{y} years and {m} months', years: '{y} years', monthsN: '{m} months', year1: '1 year', year1Months: '1 year and {m} months', month1: '1 month', recPay: 'Record payment'
    });

    // ---------- date helpers ----------
    const DAY_MS = 86400000;
    const pad2 = n => String(n).padStart(2, '0');
    function isoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
    function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
    function todayStart() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
    function daysUntil(iso) { return Math.round((parseISO(iso) - todayStart()) / DAY_MS); }
    function addMonthISO(iso) {
        const d = parseISO(iso), day = d.getDate();
        const n = new Date(d.getFullYear(), d.getMonth() + 1, 1);
        n.setDate(Math.min(day, daysInMonth(n)));
        return isoDate(n);
    }
    function fmtDate(iso, opts = { day: 'numeric', month: 'short' }) { return parseISO(iso).toLocaleDateString(LOCALES[state.lang], opts).replace('.', ''); }
    function fmtDuration(m) {
        const y = Math.floor(m / 12), r = m % 12;
        const mm = r === 1 ? t('month1') : t('monthsN', { m: r });
        if (y === 0) return mm;
        if (y === 1) return r ? t('year1Months', { m: r }) : t('year1');
        return r ? t('yearsMonths', { y, m: r }) : t('years', { y });
    }

    function sanitizeStmt(s) {
        if (!s || typeof s !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(s.due || '')) return null;
        return {
            cut: /^\d{4}-\d{2}-\d{2}$/.test(s.cut || '') ? s.cut : null, due: s.due,
            full: Math.max(0, +s.full || 0), min: Math.max(0, +s.min || 0), minEst: !!s.minEst,
            limit: Math.max(0, +s.limit || 0), fees: Math.max(0, +s.fees || 0),
            plan: ['full', 'min', 'custom'].includes(s.plan) ? s.plan : 'full', estimated: !!s.estimated
        };
    }
    function estimateMin(bal, apr) {
        if (!(bal > 0)) return 0;
        return round2(Math.min(bal, Math.max(Math.min(100, bal), bal * (apr / 1200 + 0.03))));
    }
    function dueDiff(i) { return i.stmt ? daysUntil(i.stmt.due) : dueDay(i) - new Date().getDate(); }
    function dueInMonth(i, y, m) { if (!i.stmt) return true; const d = parseISO(i.stmt.due); return d.getFullYear() === y && d.getMonth() === m; }

    // ---------- scenario math ----------
    function cardScenarios(d) {
        const r = d.apr / 1200, bal = d.full, min = Math.min(bal, d.min || estimateMin(bal, d.apr));
        const rest = Math.max(0, bal - min);
        // Bank-style minimum: interest + a small slice of capital, recalculated each month.
        const capPct = d.min > 0 && bal > 0 ? Math.min(0.15, Math.max(0.01, (d.min - (d.fees || 0)) / bal)) : 0.03;
        let b = bal, months = 0, interest = 0;
        while (b > 0.5 && months < 600) {
            const it = b * r; interest += it;
            const pay = Math.min(b + it, Math.max(Math.min(50, b + it), b * capPct + it));
            b = b + it - pay; months++;
        }
        const declining = { months, interest, never: months >= 600 };
        // Fixed payment equal to today's minimum
        let f = bal, fm = 0, fi = 0;
        const fixedNever = min <= bal * r + 0.005;
        if (!fixedNever) while (f > 0.005 && fm < 600) { const it = f * r; fi += it; f = f + it - Math.min(f + it, min); fm++; }
        return { min, rest, nextInt: rest * r, lateInt: bal * r, declining, fixed: { months: fm, interest: fi, never: fixedNever || fm >= 600 } };
    }

    function dueBadgeText(iso) {
        const n = daysUntil(iso);
        if (n < 0) return { txt: t('ccDueLate', { n: -n }), tone: 'danger' };
        if (n === 0) return { txt: t('ccDueToday'), tone: 'warn' };
        if (n === 1) return { txt: t('ccDueTomorrow'), tone: 'warn' };
        return { txt: t('ccDueIn', { n }), tone: n <= 5 ? 'warn' : 'ok' };
    }

    function timelineHTML(d) {
        const due = parseISO(d.due), today = todayStart();
        const start = d.cut ? parseISO(d.cut) : new Date(due.getTime() - 25 * DAY_MS);
        const end = new Date(due.getTime() + Math.max(8, (due - start) / DAY_MS * 0.3) * DAY_MS);
        const pos = x => Math.max(0, Math.min(100, (x - start) / (end - start) * 100));
        const pDue = pos(due), pToday = pos(today);
        const late = today > due;
        return `<div class="tl">
            <div class="tl-bar"><span class="tl-ok" style="width:${pDue}%"></span><span class="tl-late" style="left:${pDue}%; width:${100 - pDue}%"></span>
                <i class="tl-today ${late ? 'late' : ''}" style="left:${pToday}%"></i></div>
            <div class="tl-labels">
                <span style="left:0; transform:none">${esc(t('tlCut'))}${d.cut ? `<b>${esc(fmtDate(d.cut))}</b>` : ''}</span>
                <span style="left:${pDue}%">${esc(t('tlDue'))}<b>${esc(fmtDate(d.due))}</b></span>
                <span style="left:100%; transform:translateX(-100%); text-align:right" class="danger">${esc(t('tlLate'))}</span>
            </div>
            <div class="tl-now" style="left:${pToday}%">${esc(t('tlToday'))}</div>
        </div>`;
    }

    function cardInsightHTML(d) {
        if (!(d.full >= 0) || !d.due || !(d.apr >= 0)) return '';
        const s = cardScenarios(d), r = d.apr / 1200, past = daysUntil(d.due) < 0;
        const badge = dueBadgeText(d.due);
        const li = arr => `<ul class="cc-list">${arr.map(x => `<li>${x}</li>`).join('')}</ul>`;
        let html = `<div class="cc-head">
                <div><p class="eyebrow">${esc(t('ccOwe'))}</p><p class="serif num" style="font-size:32px; line-height:1.1">${fmt(d.full)}</p>
                <p class="tiny muted">${esc(t('ccDueOn', { date: fmtDate(d.due, { weekday: 'long', day: 'numeric', month: 'long' }) }))}</p></div>
                <span class="pill ${badge.tone}" style="font-size:13px; padding:5px 12px">${esc(badge.txt)}</span>
            </div>
            ${timelineHTML(d)}
            <p class="eyebrow mt-5 mb-2">${esc(t('ccWhatIf'))}</p>`;
        if (past) html += `<div class="note danger cc-scen"><b>⏰ ${esc(t('scPastT'))}</b><p>${esc(t('scPastB'))}</p></div>`;
        html += `<div class="note ok cc-scen"><b>✅ ${esc(t('scFullT', { x: fmt(d.full), date: fmtDate(d.due) }))}</b>
                <p>${esc(t('scFullB'))}</p><p class="tiny" style="opacity:.8">${esc(t('scFullNote'))}</p></div>`;
        const minLines = [esc(t('scMinB1', { rest: fmt(s.rest), int: fmt(s.nextInt) })),
            s.declining.never ? esc(t('scMinB2Never')) : esc(t('scMinB2', { time: fmtDuration(s.declining.months), total: fmt(s.declining.interest, 0) }))];
        if (!s.fixed.never) minLines.push(esc(t('scMinB3', { x: fmt(s.min), time: fmtDuration(s.fixed.months), total: fmt(s.fixed.interest, 0) })));
        html += `<div class="note warn cc-scen"><b>⚠️ ${esc(t('scMinT', { x: fmt(s.min) }))}${d.minEst ? ' *' : ''}</b>${li(minLines)}<p class="tiny" style="opacity:.85">${esc(t('scMinWhy'))}</p></div>`;
        html += `<div class="note danger cc-scen"><b>🚨 ${esc(t('scLateT'))}</b>${li([esc(t('scLate1', { int: fmt(s.lateInt) })), esc(t('scLate2')), esc(t('scLate3')), esc(t('scLate4'))])}
                <p style="font-weight:600">${esc(t('scLateTip'))}</p></div>`;
        // facts
        const facts = [];
        facts.push(`<div class="cc-fact"><b>${esc(t('ccMonthly', { m: (d.apr / 12).toFixed(1) }))}</b><span>${esc(t('ccMonthlyB', { x: fmt(1000 * r, 0) }))}</span></div>`);
        if (d.limit > 0) {
            const p = Math.round(d.full / d.limit * 100);
            facts.push(`<div class="cc-fact"><b>${esc(t('ccUse', { p }))}</b><div class="bar thin mt-1"><span style="width:${Math.min(100, p)}%; background:var(--${p > 30 ? 'warn' : 'accent'})"></span></div><span>${esc(t(p > 30 ? 'ccUseHigh' : 'ccUseOk'))}</span></div>`);
        }
        if (d.fees > 0 && s.min > 0) facts.push(`<div class="cc-fact"><b>${esc(t('ccFeesT', { x: fmt(d.fees) }))}</b><span>${esc(t('ccFeesB', { p: Math.round(d.fees / s.min * 100) }))}</span></div>`);
        if (d.cut) facts.push(`<div class="cc-fact"><b>${esc(t('ccGrace', { n: Math.round((parseISO(d.due) - parseISO(d.cut)) / DAY_MS) }))}</b><span>${esc(t('ccGraceB'))}</span></div>`);
        html += `<p class="eyebrow mt-5 mb-2">${esc(t('ccFacts'))}</p><div class="cc-facts">${facts.join('')}</div>`;
        if (d.minEst) html += `<p class="tiny faint mt-2">* ${esc(t('ccMinHint'))}</p>`;
        return html;
    }

    function glossaryHTML() {
        return `<p class="eyebrow mt-5 mb-2">📖 ${esc(t('glossTitle'))}</p>` + [['gCut', 'gCutB'], ['gDue', 'gDueB'], ['gFull', 'gFullB'], ['gMin', 'gMinB'], ['gApr', 'gAprB'], ['gLimit', 'gLimitB'], ['gMora', 'gMoraB']]
            .map(([a, b]) => `<details class="gloss"><summary>${esc(t(a))}</summary><p>${esc(t(b))}</p></details>`).join('');
    }

    function stmtData(i) { return { ...i.stmt, apr: i.apr, name: i.name }; }

    // ---------- statement roll-over: after a paid statement's due date passes, start the next cycle (estimated) ----------
    function rollStatements() {
        state.items.forEach(i => {
            if (!i.stmt) return;
            let guard = 0;
            while (i.paid && daysUntil(i.stmt.due) < 0 && guard++ < 24) {
                const s = i.stmt;
                s.cut = s.cut ? addMonthISO(s.cut) : null; s.due = addMonthISO(s.due);
                if (i.balance > 0 && i.apr > 0) i.balance = round2(i.balance * (1 + i.apr / 1200));
                s.full = i.balance; s.min = estimateMin(i.balance, i.apr); s.minEst = true; s.fees = 0; s.estimated = true;
                i.amount = s.plan === 'min' ? s.min : s.plan === 'full' ? s.full : Math.min(i.amount, s.full);
                i.date = parseISO(s.due).getDate();
                i.paid = false; i.lastPay = null;
            }
        });
    }

    function stmtLine(i) {
        const s = i.stmt, b = dueBadgeText(s.due);
        return `<p class="tiny muted mt-1">${esc(t('ccDueOn', { date: fmtDate(s.due) }))} · <span class="${b.tone === 'ok' ? '' : b.tone}">${esc(b.txt)}</span> · ${esc(t('ccPayMin'))} ${fmt(s.min, 0)} · ${esc(t('ccPayFull'))} ${fmt(s.full, 0)}</p>
            <div class="row wrap mt-1" style="gap:10px">${s.estimated ? `<span class="pill warn">${esc(t('ccEstimated'))}</span>` : ''}
            <button class="btn-link tiny" onclick="openCardInsight('${i.id}')">💡 ${esc(t('ccWhatIf'))}</button></div>`;
    }

    function ccTip() {
        const cards = state.items.filter(i => i.stmt && !i.paid && i.stmt.full > 0).sort((a, b) => daysUntil(a.stmt.due) - daysUntil(b.stmt.due));
        const c = cards[0];
        if (!c) return '';
        const n = daysUntil(c.stmt.due);
        if (n < 0) return `<p class="danger" style="font-weight:600">${esc(t('ccTipLate', { name: c.name, min: fmt(c.stmt.min) }))}</p><div class="divider" style="margin:12px 0"></div>`;
        if (n <= 7) {
            const s = cardScenarios(stmtData(c));
            return `<p class="warn" style="font-weight:600">${esc(t('ccTipSoon', { name: c.name, n, int: fmt(s.nextInt, 0) }))} <button class="btn-link small" onclick="openCardInsight('${c.id}')">${esc(t('ccWhatIf'))}</button></p><div class="divider" style="margin:12px 0"></div>`;
        }
        return '';
    }

    // ---------- card modal ----------
    let ccEditId = null, ccPlan = 'full';
    function openCardModal(id) {
        const i = id ? state.items.find(x => x.id === id) : null;
        ccEditId = i ? i.id : null;
        closeModal('entry-modal');
        const s = i && i.stmt;
        const v = (k, val) => $(k).value = (val === 0 || val == null) ? '' : val;
        v('cc-name', i ? i.name : ''); v('cc-full', s ? s.full : ''); v('cc-min', s && !s.minEst ? s.min : '');
        v('cc-cut', s ? s.cut : ''); v('cc-due', s ? s.due : ''); v('cc-apr', i ? i.apr : '');
        v('cc-limit', s ? s.limit : ''); v('cc-fees', s ? s.fees : ''); v('cc-custom', i && s && s.plan === 'custom' ? i.amount : '');
        ccPlan = s ? s.plan : 'full';
        $('cc-title').textContent = t(i ? 'ccTitleEdit' : 'ccTitle');
        $('cc-error').classList.add('hidden');
        document.querySelectorAll('#card-modal .input').forEach(el => el.classList.remove('invalid'));
        openModal('card-modal');
        ccPreview();
    }
    function pickCcPlan(p) { ccPlan = p; ccPreview(); }
    function readCcForm() {
        const n = id => parseFloat($(id).value);
        const full = n('cc-full'), minRaw = n('cc-min'), apr = n('cc-apr');
        const d = { name: $('cc-name').value.trim(), full: full >= 0 ? full : NaN, apr: apr >= 0 ? apr : NaN, due: $('cc-due').value || '',
                    cut: $('cc-cut').value || null, limit: n('cc-limit') > 0 ? n('cc-limit') : 0, fees: n('cc-fees') > 0 ? n('cc-fees') : 0 };
        d.minEst = !(minRaw > 0);
        d.min = d.minEst ? estimateMin(d.full || 0, d.apr || 0) : minRaw;
        d.custom = n('cc-custom');
        return d;
    }
    function ccPreview() {
        document.querySelectorAll('[data-ccplan]').forEach(b => b.classList.toggle('active', b.dataset.ccplan === ccPlan));
        $('cc-custom-wrap').classList.toggle('hidden', ccPlan !== 'custom');
        const d = readCcForm();
        $('cc-min').placeholder = d.full > 0 && d.apr >= 0 ? `≈ ${fmt(estimateMin(d.full, d.apr || 0))}` : '';
        const ready = d.full >= 0 && d.due && d.apr >= 0;
        $('cc-preview-wrap').classList.toggle('hidden', !ready);
        if (ready) $('cc-preview').innerHTML = cardInsightHTML(d);
    }
    function saveCard() {
        const d = readCcForm(), errs = [];
        const mark = (id, bad, k) => { $(id).classList.toggle('invalid', bad); if (bad) errs.push(t(k)); };
        mark('cc-full', !(d.full >= 0), 'ccErrFull');
        mark('cc-due', !d.due, 'ccErrDue');
        mark('cc-apr', !(d.apr >= 0), 'ccErrApr');
        mark('cc-custom', ccPlan === 'custom' && !(d.custom > 0), 'ccErrCustom');
        if (errs.length) { $('cc-error').textContent = errs.join(' '); $('cc-error').classList.remove('hidden'); return; }
        const amount = round2(ccPlan === 'full' ? d.full : ccPlan === 'min' ? Math.min(d.full, d.min) : d.custom);
        const stmt = sanitizeStmt({ ...d, plan: ccPlan, estimated: false });
        const name = d.name || t('subCC');
        let item = ccEditId && state.items.find(x => x.id === ccEditId);
        if (item) {
            Object.assign(item, { name, apr: d.apr, amount, balance: round2(d.full), date: parseISO(d.due).getDate(), stmt,
                                  startBalance: Math.max(item.startBalance || 0, round2(d.full)), subtype: 'cc', type: 'debt', completed: false });
            if (item.paid && daysUntil(d.due) >= 0 && !(item.history || []).some(h => h.ts > parseISO(d.cut || d.due).getTime())) { item.paid = false; item.lastPay = null; }
        } else {
            item = { id: uid(), type: 'debt', subtype: 'cc', name, amount, date: parseISO(d.due).getDate(), balance: round2(d.full), startBalance: round2(d.full),
                     apr: d.apr, totalMonths: 0, monthsPaid: 0, paid: false, completed: false, extraPaid: 0, lastPay: null, history: [], stmt };
            state.items.push(item);
        }
        closeModal('card-modal'); render();
        openCardInsight(item.id);
    }

    function openCardInsight(id) {
        const i = state.items.find(x => x.id === id);
        if (!i || !i.stmt) return;
        $('ci-title').textContent = `${t('ccInsightTitle')} · ${i.name}`;
        $('ci-body').innerHTML = cardInsightHTML(stmtData(i)) + glossaryHTML();
        $('ci-pay').classList.toggle('hidden', !!i.paid);
        $('ci-pay').onclick = () => { closeModal('card-insight'); openPaymentModal(i.id); };
        $('ci-edit').onclick = () => { closeModal('card-insight'); openCardModal(i.id); };
        openModal('card-insight');
    }

    // ---------- payment with statement choices ----------
    let ccPayChoice = 'full';
    function setupStmtPayment(item) {
        const wrap = $('pay-stmt');
        if (!item.stmt) { wrap.classList.add('hidden'); return false; }
        wrap.classList.remove('hidden');
        $('pay-extra-wrap').classList.add('hidden');
        const s = item.stmt;
        ccPayChoice = s.plan === 'min' ? 'min' : s.plan === 'custom' ? 'other' : 'full';
        $('pay-cc-full').innerHTML = `${esc(t('ccPayFull'))}<b class="num">${fmt(s.full, 0)}</b>`;
        $('pay-cc-min').innerHTML = `${esc(t('ccPayMin'))}<b class="num">${fmt(Math.min(s.min, s.full), 0)}</b>`;
        $('pay-cc-other').innerHTML = `${esc(t('ccPayOther'))}<b>…</b>`;
        $('pay-cc-amount').value = s.plan === 'custom' ? item.amount : '';
        stmtPayPreview();
        return true;
    }
    function pickPayChoice(k) { ccPayChoice = k; stmtPayPreview(); if (k === 'other') setTimeout(() => $('pay-cc-amount').focus(), 30); }
    function stmtPayAmount(item) {
        const s = item.stmt;
        if (ccPayChoice === 'full') return s.full;
        if (ccPayChoice === 'min') return Math.min(s.min, s.full);
        return Math.max(0, parseFloat($('pay-cc-amount').value) || 0);
    }
    function stmtPayPreview() {
        const item = state.items.find(i => i.id === activePaymentId);
        if (!item || !item.stmt) return;
        ['full', 'min', 'other'].forEach(k => $('pay-cc-' + k).classList.toggle('on', ccPayChoice === k));
        $('pay-cc-amount-wrap').classList.toggle('hidden', ccPayChoice !== 'other');
        const s = item.stmt, amt = stmtPayAmount(item), rest = Math.max(0, s.full - amt), el = $('pay-cc-msg');
        if (amt >= s.full - 0.005) { el.className = 'note ok small'; el.textContent = t('ccPayOkFull'); }
        else if (amt < Math.min(s.min, s.full) - 0.005) { el.className = 'note danger small'; el.textContent = t('ccPayLow', { min: fmt(s.min) }); }
        else { el.className = 'note warn small'; el.textContent = t('ccPayRest', { rest: fmt(rest), int: fmt(rest * item.apr / 1200) }); }
    }
    // Returns a celebrate object or null; called from confirmTransaction for statement cards.
    function confirmStmtPayment(item) {
        const s = item.stmt, amt = round2(Math.min(s.full, stmtPayAmount(item)));
        if (!(amt > 0)) return { abort: true };
        item.lastPay = { balance: item.balance, monthsPaid: 0, extra: 0, stmt: { ...s }, wasPaid: false };
        const extra = Math.max(0, round2(amt - item.amount));
        item.balance = round2(Math.max(0, item.balance - amt));
        item.extraPaid = (item.extraPaid || 0) + extra;
        item.lastPay.extra = extra;
        item.history = item.history || [];
        item.history.push({ ts: Date.now(), amount: round2(amt - extra), extra });
        const minNeeded = Math.min(s.min, s.full);
        s.full = round2(Math.max(0, s.full - amt));
        if (amt + 0.005 < minNeeded) { s.min = round2(minNeeded - amt); return { short: s.min }; }
        s.min = 0;
        item.paid = true;
        return s.full === 0 ? { big: true, msg: t('ccPaidFullToast') } : null;
    }

    // ================= Mascot: an original frog drawn in SVG =================
    // Outline trick: every shape is drawn once thick in ink (the outline), then again filled on top.
    const FROG = { skin: '#46BE7B', shade: '#2F9A5E', belly: '#C9EFC9', ink: '#12302A', cheek: '#FF7FA0', gold: '#F2B43C', goldDk: '#C98A12' };
    function frogSVG(mood = 'hi', size = 120, label = '') {
        const F = FROG;
        const legs = `<ellipse cx="40" cy="122" rx="22" ry="11"/><ellipse cx="120" cy="122" rx="22" ry="11"/>`;
        const body = `<ellipse cx="80" cy="96" rx="48" ry="36"/><ellipse cx="80" cy="70" rx="56" ry="36"/><circle cx="50" cy="40" r="21"/><circle cx="110" cy="40" r="21"/>`;
        const wave = mood === 'hi';
        const armR = wave ? `<path d="M118 92 Q138 78 140 56" stroke-width="15" stroke-linecap="round" fill="none"/><circle cx="141" cy="52" r="9"/>` : `<ellipse cx="108" cy="116" rx="11" ry="8"/>`;
        const armL = `<ellipse cx="52" cy="116" rx="11" ry="8"/>`;
        const outline = `<g fill="${F.ink}" stroke="${F.ink}" stroke-width="6" stroke-linejoin="round">${legs}${body}${armL}${wave ? '' : armR}</g>${wave ? `<g stroke="${F.ink}" fill="${F.ink}"><path d="M118 92 Q138 78 140 56" stroke-width="21" stroke-linecap="round" fill="none"/><circle cx="141" cy="52" r="12"/></g>` : ''}`;
        const fill = `<g fill="${F.shade}">${legs}</g><g fill="${F.skin}">${body}</g>
            <ellipse cx="80" cy="102" rx="30" ry="22" fill="${F.belly}"/>
            <g fill="${F.shade}" stroke="${F.shade}">${armL}${wave ? '' : armR}</g>${wave ? `<g fill="${F.skin}" stroke="${F.skin}">${armR}</g>` : ''}`;

    // ---------- taxes ----------
    const IGSS_RATE = 0.0483, ISR_DEDUCTION = 48000;
    function salaryTaxes(gross) {
        const igss = gross * IGSS_RATE;
        const base = gross * 12 - igss * 12 - ISR_DEDUCTION;
        const isrYear = base <= 0 ? 0 : base <= 300000 ? base * 0.05 : 15000 + (base - 300000) * 0.07;
        return { igss: round2(igss), isr: round2(isrYear / 12) };
    }
    function selfTaxes(gross, regime) {
        if (regime === 'peq') return { peq: round2(gross * 0.05) };
        const base = gross / 1.12;
        const isr = base <= 30000 ? base * 0.05 : 1500 + (base - 30000) * 0.07;
        return { isr: round2(isr), iva: round2(gross - base) };
    }
    // Returns { parts: [[labelKey, amount]], total } for a monthly gross amount.
    function taxBreakdown(type, mode, regime, pct, gross) {
        if (type === 'remit' || !['auto', 'manual'].includes(mode) || !(gross > 0)) return { parts: [], total: 0 };
        if (mode === 'manual') { const v = round2(gross * Math.min(50, Math.max(0, +pct || 0)) / 100); return { parts: [['taxYours', v]], total: v }; }
        if (type === 'fixed') { const s = salaryTaxes(gross); return { parts: [['taxIgss', s.igss], ['taxIsr', s.isr]], total: round2(s.igss + s.isr) }; }
        const s = selfTaxes(gross, regime);
        return regime === 'peq' ? { parts: [['taxIvaPeq', s.peq]], total: s.peq } : { parts: [['taxIsr', s.isr], ['taxIva', s.iva]], total: round2(s.isr + s.iva) };
    }
    function monthlyTaxes() { return taxBreakdown(state.incomeType, state.taxMode, state.taxRegime, state.taxPct, state.income).total; }

    // ---------- suggested plans ----------
    const PLAN_MODES = ['rec', 'fast', 'easy', 'custom'];
    function planContext(income, fixed) {
        const debts = activeDebts();
        const efG = typeof emergencyGoal === 'function' ? emergencyGoal() : null;
        const basics = Math.max(0, fixed);
        return {
            avail: income > 0 ? Math.max(0, (income - fixed) / income) : 0,
            hasDebt: debts.length > 0,
            hasHigh: debts.some(d => d.apr >= 20) || state.items.some(i => i.type === 'debt' && i.subtype === 'cc' && !i.completed && i.balance > 0),
            efOk: !!efG && efG.saved >= basics && basics > 0
        };
    }
    // b = % of income for daily spending, s = % of what's left that goes to debt (rest is savings).
    function planFor(mode, ctx) {
        const share = { rec: ctx.hasHigh ? 0.55 : 0.6, fast: 0.42, easy: 0.75 }[mode] || 0.6;
        const cap = mode === 'easy' ? 45 : 35;
        const b = Math.round(Math.min(cap, Math.max(5, ctx.avail * 100 * share)));
        let s = 0;
        if (ctx.hasDebt) s = mode === 'fast' ? 90 : ctx.hasHigh ? (ctx.efOk ? 80 : 60) : 40;
        return { b, s };
    }
    function effectivePlan(income, fixed) {
        if (state.planMode === 'custom' || !PLAN_MODES.includes(state.planMode)) return { b: state.bufferPct, s: state.surplusPct };
        return planFor(state.planMode, planContext(income, fixed));
    }

    // ---------- plan picker in Perfil ----------

    // Use what's typed in the income editor (not yet saved) so the options match it.
    function planBase() {
        const d = IE.cfg, items = state.items.reduce((a, i) => a + i.amount, 0);
        if (d && parseFloat(d.amount) > 0) return { income: ieMonthly(d), fixed: items + ieTaxes(d).total };
        const c = compute(); return { income: c.income, fixed: c.fixed };
    }
    function planNumbers(p) {
        const { income, fixed } = planBase();
        const afterFixed = Math.max(0, income - fixed);
        const buffer = Math.min(income * p.b / 100, afterFixed);
        const rem = afterFixed - buffer, debt = rem * p.s / 100;
        return { daily: buffer / daysInMonth(new Date()), debt, save: rem - debt };
    }
    function renderPlanPicker() {
        const el = $('plan-picker'); if (!el) return;
        if (!planDraft) planDraft = PLAN_MODES.includes(state.planMode) ? state.planMode : 'custom';
        const c = planBase(), ctx = planContext(c.income, c.fixed);
        const opt = (mode, title, sub) => {
            const p = mode === 'custom' ? { b: clampInt($('c-buffer').value, 0, 100, state.bufferPct), s: clampInt($('c-surplus').value, 0, 100, state.surplusPct) } : planFor(mode, ctx);

    // ---------- repeat expenses ----------
    function expenseKey(e) { return `${e.cat}|${(e.note || '').trim().toLowerCase()}|${e.amount}`; }
    function frequentExpenses() {
        const since = Date.now() - 60 * 86400000, groups = new Map();
        state.expenses.filter(e => e.ts >= since).forEach(e => {
            const k = expenseKey(e), g = groups.get(k);
            if (g) { g.n++; if (e.ts > g.e.ts) g.e = e; } else groups.set(k, { n: 1, e });
        });
        return [...groups.values()].filter(g => g.n >= 2).sort((a, b) => b.n - a.n || b.e.ts - a.e.ts).slice(0, 5).map(g => g.e);
    }
    function repeatExpense(id) {
        const e = state.expenses.find(x => x.id === id);
        if (!e) return;
        state.expenses.push({ id: uid(), amount: e.amount, note: e.note, ts: Date.now(), period: state.period, cat: e.cat });
        render();
        if (!limitToast(e.cat, e.amount)) toast(`${catOf(e.cat).emoji} ${t('repeatToast', { x: (e.note || t('cat_' + e.cat)) + ' · ' + fmt(e.amount) })}`);
    }
    function renderQuickSpend() {
        const el = $('quick-spend'); if (!el) return;
        const list = frequentExpenses();
        el.classList.toggle('hidden', !list.length);
        el.innerHTML = list.length ? `<span class="quick-label"><i data-lucide="repeat"></i>${esc(t('quickTitle'))}</span>` + list.map(e =>
            `<button class="quick-chip" onclick="repeatExpense('${e.id}')" title="${esc(t('repeatBtn'))}">${catOf(e.cat).emoji} ${esc(e.note || t('cat_' + e.cat))} <b class="num">${fmt(e.amount, 0)}</b></button>`).join('') : '';
    }

    // ---------- ant spending ("gastos hormiga") ----------
    function antInsight(c) {
        const dim = daysInMonth(new Date()), day = new Date().getDate();
        const small = Math.max(10, (c.buffer / dim) * 0.4);
        const groups = new Map();
        c.monthExp.filter(e => e.amount <= small).forEach(e => {
            const note = (e.note || '').trim();
            const key = note ? 'n:' + note.toLowerCase() : 'c:' + e.cat;
            const g = groups.get(key) || { name: note || t('cat_' + e.cat), n: 0, total: 0 };
            g.n++; g.total += e.amount; groups.set(key, g);
        });
        const top = [...groups.values()].filter(g => g.n >= 4).sort((a, b) => b.total - a.total)[0];
        if (!top) return '';
        const proj = day >= 7 ? top.total / day * dim : top.total;
        return `<div class="ant"><span class="e" aria-hidden="true">🐜</span><div>${t('antMsg', { total: esc(fmt(top.total, 0)), name: esc(top.name), n: top.n })}
            ${day >= 7 && proj > top.total * 1.15 ? ' ' + esc(t('antProj', { proj: fmt(proj, 0) })) : ''} ${esc(t('antTip', { half: fmt(proj / 2, 0) }))}</div></div>`;
    }

    // ---------- next payment strip on the home card ----------
    function nextDueHTML() {
        const next = state.items.filter(i => !i.paid && !i.completed).sort((a, b) => dueDiff(a) - dueDiff(b))[0];
        if (!next) return '';
        const d = dueDiff(next);
        const tone = d < 0 ? 'danger' : d <= 3 ? 'warn' : 'ok';
        const big = d === 0 ? t('ndToday') : String(Math.abs(d));
        const small = d === 0 ? '' : d < 0 ? t('ndLate') : d === 1 ? t('ndDay') : t('ndDays');
        const date = next.stmt ? parseISO(next.stmt.due) : (() => { const x = new Date(); x.setDate(dueDay(next)); return x; })();
        return `<button class="next-due ${tone}" onclick="openPaymentModal('${next.id}')">
            <span class="nd-days"><b class="num">${esc(big)}</b>${small ? `<small>${esc(small)}</small>` : ''}</span>
            <span class="grow" style="min-width:0">
                <span class="tiny muted" style="display:block">${esc(t('nextDue'))} · ${esc(date.toLocaleDateString(LOCALES[state.lang], { day: 'numeric', month: 'short' }))}</span>
                <b class="truncate" style="display:block">${esc(next.name)}</b>
                <span class="small num">${fmt(next.amount)}</span>
            </span>
            <span class="btn btn-sm nd-btn">${esc(t('payBtn'))}</span>
        </button>`;
    }

            const btn = document.createElement('button');

            btn.innerHTML = '<i data-lucide="info"></i>';
            const label = () => { const open = sub.classList.contains('show'); btn.title = t(open ? 'infoHide' : 'infoShow'); btn.setAttribute('aria-label', btn.title); btn.setAttribute('aria-expanded', open); btn.classList.toggle('on', open); };

    const AUTH = { sb: null, user: null, vaultKey: null, mem: new Map(), view: null, opts: {}, pinBuf: '', pinStage: 'new', pinFirst: '',

    const VAULT_KEY = 'ap.vault', DEVICE_KEY = 'ap.device', PIN_LEN = 6, MAX_TRIES = 5;
    const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* blocked */ } };
    const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* blocked */ } };

    // ---------- crypto vault ----------
    const b64e = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
    const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    const hasCrypto = () => !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
    async function deriveKey(pinStr, saltB64) {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pinStr), 'PBKDF2', false, ['deriveKey']);
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(saltB64), iterations: 250000, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    let vaultChain = Promise.resolve();
    function persistVault() {
        if (!AUTH.vaultKey) return vaultChain;
        const key = AUTH.vaultKey, snapshot = JSON.stringify([...AUTH.mem]);
        vaultChain = vaultChain.then(async () => {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(snapshot));
            lsSet(VAULT_KEY, JSON.stringify({ iv: b64e(iv), ct: b64e(ct) }));
        }).catch(() => { /* keep the previous vault */ });
        return vaultChain;
    }
    async function openVault(pinStr) {
        const dev = getDevice(), raw = lsGet(VAULT_KEY);
        if (!dev || !raw) return false;
        try {
            const key = await deriveKey(pinStr, dev.salt), v = JSON.parse(raw);
            const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(v.iv) }, key, b64d(v.ct));
            AUTH.mem = new Map(JSON.parse(new TextDecoder().decode(pt)));
            AUTH.vaultKey = key;
            return true;
        } catch (e) { return false; }
    }
    function wipeDevice() {
        AUTH.vaultKey = null; AUTH.mem = new Map();
        lsDel(VAULT_KEY); lsDel(DEVICE_KEY);

    // ---------- account PIN: one PIN for every device (verifier kept in the account, hashed) ----------
    async function pinVerifier(pinStr, saltB64) {
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode('ap-account:' + pinStr), 'PBKDF2', false, ['deriveBits']);
        const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64d(saltB64), iterations: 310000, hash: 'SHA-256' }, base, 256);
        return b64e(bits);
    }

    async function freshUser(fallback) {
        try { const r = await makeClient().auth.getUser(); if (r && r.data && r.data.user) return r.data.user; } catch (e) { /* offline */ }
        return fallback;
    }
    async function saveAccountPin(pinStr) {
        try {
            const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));
            const hash = await pinVerifier(pinStr, salt);
            const { data, error } = await makeClient().auth.updateUser({ data: { pin_salt: salt, pin_hash: hash, pin_v: 1 } });
            if (error) throw error;
            if (data && data.user) AUTH.user = data.user;
            return true;
        } catch (e) { return false; }
    }
    async function setupDeviceVault(pinStr, user) {
        const salt = b64e(crypto.getRandomValues(new Uint8Array(16)));

    const field = (id, label, type, val = '', extra = '') => type === 'password'
        ? `<div><label class="label" for="${id}">${esc(label)}</label><div class="pw-wrap"><input id="${id}" type="password" class="input" value="${esc(val)}" ${extra}><button type="button" class="pw-eye" onclick="togglePw('${id}', this)" aria-controls="${id}">${esc(t('aShow'))}</button></div></div>`
        : `<div><label class="label" for="${id}">${esc(label)}</label><input id="${id}" type="${type}" class="input" value="${esc(val)}" ${extra}></div>`;
    function togglePw(id, btn) { const i = $(id); const show = i.type === 'password'; i.type = show ? 'text' : 'password'; btn.textContent = t(show ? 'aHide' : 'aShow'); i.focus(); }
    const msgP = o => `<p id="a-msg" class="small ${o.ok ? 'accent' : 'danger'}" style="min-height:20px">${esc(o.msg || '')}</p>`;
    function keypadAuth() {
        const k = n => `<button onclick="authKey('${n}')">${n}</button>`;
        return `<div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k).join('')}<span></span>${k(0)}<button class="ghost" onclick="authKey('del')" aria-label="⌫">⌫</button></div>`;
    }
    const dotsAuth = n => `<div id="a-dots" class="pin-dots">${Array.from({ length: PIN_LEN }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`;

    function showAuth(view, opts = {}) {
        AUTH.view = view; AUTH.opts = opts;
        const el = $('auth'), dev = getDevice();
        let html = '';
        if (view === 'welcome') html = `<div class="auth-welcome">
                <div class="aw-frog">${mascot('saludo', 190)}</div>
                <h1 class="aw-h">${esc(t('awTitle'))}</h1>
                <p class="muted">${esc(t('awBody'))}</p>
                <ul class="aw-list">
                    <li>${mascot('presupuesto', 52)}<span>${esc(t('awP1'))}</span></li>
                    <li>${mascot('planeando', 52)}<span>${esc(t('awP2'))}</span></li>
                    <li>${mascot('pagando', 52)}<span>${esc(t('awP3'))}</span></li>
