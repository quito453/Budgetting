# Valiu · Supabase (publicado desde GitHub)
# Con la integración de GitHub (Deploy to production encendido), cada push a main publica
# las Edge Functions de esta lista. Los secretos (CRON_SECRET, VAPID, FCM, APNS) se quedan en Supabase, no aquí.
project_id = "fbcmeqsxrvusnpcfwufu"

# Migraciones: los archivos nuevos de supabase/migrations se aplican solos al hacer push a main.
# Los update-*.sql anteriores ya se corrieron a mano en el SQL Editor y no están aquí.
[db.migrations]
enabled = true

# Apple Pay y Back Tap: el iPhone no inicia sesión, se identifica con el enlace personal (?t=...).
[functions.gasto]
verify_jwt = false

# Recordatorios diarios: lo llama el cron de la base con x-cron-secret, no con sesión.
[functions.recordatorios]
verify_jwt = false
